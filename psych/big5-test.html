<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="keywords" content="성격 5요인, 빅파이브 테스트, Big Five, MBTI 대신, 성격 테스트, 심리테스트">
<meta property="og:title" content="MBTI 말고, 나의 성격 5요인은? — 썸 탐구생활">
<meta property="og:description" content="개방성·성실성·외향성·우호성·정서 민감성. 지금 나에게 제일 진하게 나오는 결은?">
<meta property="og:url" content="https://som-tamgu-site.vercel.app/psych/big5-test.html">

<style>
  :root{
    --bg: #F2F1F9; --paper: #FFFFFF; --line: #E0DEEE;
    --ink: #2A2836; --ink-soft: #625E75;
    --indigo:#6B66A8; --indigo-dark:#4E4A85;
    --plum:#B4739C; --bubble-me: #ECEAF7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(107,102,168,0.12) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(180,115,156,0.08) 0%, transparent 40%);
    font-family: 'Gowun Dodum', sans-serif; color: var(--ink);
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px 12px;
  }
  .display{ font-family:'Gaegu', 'Gowun Dodum', sans-serif; }
  .crumb-bar{
    width:100%; max-width:400px; margin: 0 auto 12px;
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size: 13px;
  }
  .crumb-bar a{ color:#8A5A1F; text-decoration:none; }
  .crumb-bar span{ color:#B4ABA0; }
  .crumb-bar .current{ color:#3A2E39; }

  .phone{
    width: 100%; max-width: 400px; background: var(--paper); border-radius: 32px;
    border: 1px solid var(--line); box-shadow: 0 20px 50px -20px rgba(42,40,54,0.25), 0 4px 12px rgba(42,40,54,0.06);
    overflow: hidden; position: relative; min-height: 640px; display:flex; flex-direction:column;
  }
  .phone-header{ padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap: 10px; }
  .avatar{ width: 38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--indigo), var(--plum)); display:flex; align-items:center; justify-content:center; font-size: 18px; flex-shrink:0; }
  .header-text .name{ font-weight:700; font-size:15px; }
  .header-text .status{ font-size:11.5px; color: var(--ink-soft); }
  .progress-wrap{ height: 4px; background: var(--line); position: relative; z-index: 2; }
  .progress-bar{ height:100%; width: 0%; background: var(--indigo-dark); transition: width 0.4s ease; }

  .screen{ flex:1; display:flex; flex-direction:column; padding: 22px 18px; overflow-y:auto; position:relative; }
  .hidden{ display:none !important; }

  #intro{ align-items:center; justify-content:center; text-align:center; gap:16px; flex:1; }
  #intro .big-emoji{ font-size: 52px; }
  #intro h1{ font-size: 24px; line-height:1.4; }
  #intro p{ font-size: 14px; color: var(--ink-soft); line-height:1.6; padding: 0 4px; }
  .cta-btn{
    margin-top: 10px; background: var(--indigo-dark); color: white; border:none; padding: 14px 32px;
    border-radius: 999px; font-size: 15px; font-weight: 700; cursor:pointer;
    box-shadow: 0 8px 16px -6px rgba(78,74,133,0.4);
  }
  .cta-btn:active{ transform: scale(0.96); }
  .meta-note{ font-size: 11.5px; color:#A9A4BB; margin-top:4px; }

  #quiz{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
  .bubble-row{ display:flex; margin-bottom: 4px; }
  .bubble{ max-width: 86%; padding: 12px 16px; border-radius: 18px; font-size: 14.2px; line-height:1.55; animation: pop 0.25s ease; }
  @keyframes pop{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:translateY(0);} }
  /* 질문(상대)은 중립 회색, 대답(나)은 보라 계열로 확실히 구분 */
  .bubble.them{ background: #F1F2F5; border: 1px solid #E3E4EA; color: var(--ink); border-bottom-left-radius: 4px; }
  .answers{ display:flex; flex-direction:column; gap:8px; margin-top: 4px; }
  .answer-btn{
    align-self: flex-end; max-width: 90%; text-align:left; background: #DCD7F2;
    border: 1px solid #B3AAE2; color: #3F3B72; padding: 10px 16px; border-radius: 16px;
    border-bottom-right-radius: 4px; font-size: 13.5px; line-height:1.5; cursor:pointer;
  }
  .answer-btn:hover{ background:#CFC8EC; }
  .answer-btn:active{ transform: scale(0.98); }

  #result{ align-items:center; text-align:center; gap:10px; flex:1; justify-content:center; }
  .result-card{
    width:100%; background: linear-gradient(180deg, #FEFDFF, #F2F1F9); border: 1px solid var(--line);
    border-radius: 22px; padding: 26px 20px 22px; position:relative; box-shadow: 0 10px 24px -14px rgba(42,40,54,0.2);
  }
  .type-tag{ display:inline-block; background: var(--ink); color: white; font-size: 11px; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
  .trait-label{ font-size:12.5px; color: var(--indigo-dark); font-weight:700; margin-bottom:6px; }
  .type-name{ font-size: 21px; font-weight:700; line-height:1.3; margin-bottom: 14px; }
  .type-desc{ font-size: 13.5px; line-height:1.7; color: var(--ink); text-align:left; }

  /* 5요인 점수를 막대로 함께 보여주는 영역 */
  .bars{ margin-top:18px; text-align:left; display:flex; flex-direction:column; gap:8px; }
  .bar-row{ display:flex; align-items:center; gap:8px; font-size:11.5px; color: var(--ink-soft); }
  .bar-name{ width:76px; flex-shrink:0; }
  .bar-track{ flex:1; height:7px; background:#E4E2F0; border-radius:999px; overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--indigo), var(--plum)); border-radius:999px; width:0; transition: width 0.6s ease; }
  .bar-val{ width:22px; text-align:right; flex-shrink:0; }

  .tip-box{
    margin-top:16px; background: var(--paper); border: 1px dashed var(--line); border-radius: 14px;
    padding: 12px 14px; text-align:left; font-size: 12.5px; color: var(--ink-soft); line-height:1.6;
  }
  .tip-box b{ color: var(--indigo-dark); }
  /* 어떤 개념을 참고했는지 밝히는 줄 (공식 검사와 구분) */
  .source-note{ margin-top:12px; text-align:left; font-size: 11.5px; color:#9B96AC; line-height:1.6; }
  .read-more{ margin-top:14px; display:inline-block; font-size:12.5px; color: var(--ink-soft); text-decoration:underline; }
  .action-row{ display:flex; gap:8px; width:100%; margin-top: 16px; }
  .action-btn{ flex:1; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight:700; cursor:pointer; border: none; }
  .action-btn.share{ background: var(--ink); color:white; }
  .action-btn.restart{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .copy-toast{
    position:absolute; bottom: -6px; left:50%; transform: translateX(-50%) translateY(100%);
    background: var(--ink); color:white; font-size:12px; padding: 8px 14px; border-radius: 999px;
    opacity:0; transition: opacity 0.25s ease; white-space:nowrap;
  }
  .copy-toast.show{ opacity:1; }
</style>
</head>

<div class="phone">
  <div class="phone-header">
    <div class="avatar">🧩</div>
    <div class="header-text">
      <div class="name display">성격 다섯 결 연구소</div>
      <div class="status" id="statusText">대화 중...</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- INTRO -->
  <div id="intro" class="screen">
    <div class="big-emoji">🧩</div>
    <h1 class="display">MBTI 말고,<br>나는 어떤 결일까?</h1>
    <p>심리학에서 성격을 볼 때 가장 많이 쓰는<br>다섯 가지 결로 나눠봐요. 10문항이면 끝!</p>
    <button class="cta-btn" onclick="startQuiz()">시작하기 →</button>
    <div class="meta-note">약 50초 소요 · 진단이 아닌 자기 이해용 테스트예요</div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen hidden"></div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="result-card" id="resultCard">
      <span class="type-tag">RESULT</span>
      <div class="trait-label" id="rTrait"></div>
      <div class="type-name display" id="rName"></div>
      <div class="type-desc" id="rDesc"></div>
      <div class="bars" id="rBars"></div>
      <div class="tip-box" id="rTip"></div>
      <div class="source-note" id="rSource"></div>
      <a class="read-more" href="articles/big-five-vs-mbti.html">심리학 교과서에 MBTI가 없는 이유 →</a>
      <div class="copy-toast" id="copyToast">링크가 복사됐어요!</div>
    </div>
    <div class="action-row">
      <button class="action-btn share" onclick="copyResult()">결과 공유하기</button>
      <button class="action-btn restart" onclick="restartQuiz()">다시하기</button>
    </div>
  </div>
</div>
</div>

<script>
// 성격 5요인(Big Five) 축. 문항마다 각 축에 대응하는 보기를 하나씩 두어 균형을 맞춤
// open: 개방성 / consc: 성실성 / extra: 외향성 / agree: 우호성 / neuro: 정서 민감성
const questions = [
  { them: "주말에 갑자기 시간이 비었어. 제일 먼저 하는 건?", options:[
      {text:"안 가본 데나 새 취미를 찾아본다", val:"open"},
      {text:"밀린 일부터 하나씩 정리한다", val:"consc"},
      {text:"사람들 불러서 뭐라도 한다", val:"extra"},
      {text:"보자는 사람 일정에 맞춘다", val:"agree"},
      {text:"요즘 마음 쓰이는 일이 계속 떠오른다", val:"neuro"}
    ]},
  { them: "처음 가는 모임, 문을 열자마자 드는 생각은?", options:[
      {text:"여기 분위기 흥미롭다", val:"open"},
      {text:"오늘 뭐 하러 왔는지부터 정리한다", val:"consc"},
      {text:"누구랑 먼저 말 섞을까", val:"extra"},
      {text:"혼자 뻘쭘한 사람 없나 살핀다", val:"agree"},
      {text:"내가 어떻게 보일지 신경 쓰인다", val:"neuro"}
    ]},
  { them: "잡혀 있던 일정이 갑자기 엎어졌다. 너는?", options:[
      {text:"오히려 새 흐름이 재밌다", val:"open"},
      {text:"바로 계획을 다시 짠다", val:"consc"},
      {text:"누구랑 뭐할지부터 다시 잡는다", val:"extra"},
      {text:"다른 사람 곤란하지 않게 조정한다", val:"agree"},
      {text:"마음이 먼저 불편해진다", val:"neuro"}
    ]},
  { them: "친구가 힘들다고 털어놓을 때 내 반응은?", options:[
      {text:"다른 관점을 하나 던져준다", val:"open"},
      {text:"뭘 언제 할지 같이 정리해준다", val:"consc"},
      {text:"당장 만나서 기분부터 풀어준다", val:"extra"},
      {text:"편들면서 끝까지 들어준다", val:"agree"},
      {text:"그 얘기가 나한테도 오래 남는다", val:"neuro"}
    ]},
  { them: "나를 설명하는 말로 제일 가까운 건?", options:[
      {text:"궁금한 게 많다", val:"open"},
      {text:"맡은 건 어떻게든 끝낸다", val:"consc"},
      {text:"에너지가 밖으로 향한다", val:"extra"},
      {text:"부딪히는 걸 유독 싫어한다", val:"agree"},
      {text:"기분 변화가 빠르다", val:"neuro"}
    ]},
  { them: "오래 못 참는 상황은?", options:[
      {text:"매일 똑같은 게 반복될 때", val:"open"},
      {text:"일이 대충 뭉개질 때", val:"consc"},
      {text:"혼자 조용한 시간이 계속될 때", val:"extra"},
      {text:"사람들이 서로 날카로울 때", val:"agree"},
      {text:"결과를 모른 채 기다릴 때", val:"neuro"}
    ]},
  { them: "여행 계획은 보통 어떻게 세워?", options:[
      {text:"가서 흘러가는 대로가 좋다", val:"open"},
      {text:"동선이랑 예약 다 잡아둔다", val:"consc"},
      {text:"같이 갈 사람부터 모은다", val:"extra"},
      {text:"다들 가고 싶은 곳에 맞춘다", val:"agree"},
      {text:"변수랑 사고 날 일부터 확인한다", val:"neuro"}
    ]},
  { them: "제일 듣고 싶은 칭찬은?", options:[
      {text:"\"생각이 남다르다\"", val:"open"},
      {text:"\"믿고 맡길 수 있다\"", val:"consc"},
      {text:"\"같이 있으면 즐겁다\"", val:"extra"},
      {text:"\"같이 있으면 편하다\"", val:"agree"},
      {text:"\"섬세하고 잘 알아챈다\"", val:"neuro"}
    ]},
  { them: "잠들기 전 머릿속에 남아 있는 건?", options:[
      {text:"해보고 싶은 것들", val:"open"},
      {text:"내일 할 일 목록", val:"consc"},
      {text:"오늘 만난 사람들 얘기", val:"extra"},
      {text:"내가 누구 서운하게 한 건 아닐까", val:"agree"},
      {text:"아직 안 끝난 걱정", val:"neuro"}
    ]},
  { them: "마지막. 내가 제일 자주 하는 말은?", options:[
      {text:"\"그거 한번 해볼까?\"", val:"open"},
      {text:"\"일단 정리부터 하자\"", val:"consc"},
      {text:"\"나올 사람?\"", val:"extra"},
      {text:"\"너는 어때?\"", val:"agree"},
      {text:"\"괜찮은 거 맞지?\"", val:"neuro"}
    ]}
];

const traits = {
  open: {
    label: "개방성 (Openness)",
    name: "새로운 문을 먼저 열어보는 사람",
    desc: "같은 걸 반복하는 데서 제일 빨리 지치고, 안 해본 쪽으로 손이 먼저 가는 편이에요. 아이디어를 던지는 역할을 자주 맡고, 남들이 못 보는 연결을 찾아내는 게 강점이죠. 대신 시작한 걸 끝까지 붙잡는 건 상대적으로 덜 즐거워서, 벌여둔 게 여러 개 남아 있을 수 있어요.",
    tip: "새로 시작하는 힘은 이미 충분해요. 대신 ‘끝내는 규칙’ 하나만 만들면 흥미가 결과로 남습니다."
  },
  consc: {
    label: "성실성 (Conscientiousness)",
    name: "계획대로 굴러가야 편한 사람",
    desc: "해야 할 걸 미뤄두면 마음이 안 편한 편이에요. 다섯 요인 중에서 성실성은 학업·업무 성과와의 관련이 특히 꾸준히 보고되는 축이라, 주변에서 ‘믿고 맡길 사람’으로 불릴 일이 많아요. 다만 계획이 어긋날 때 스스로에게 제일 엄격해지는 쪽이기도 해요.",
    tip: "일정이 틀어져도 하루는 그냥 흘려보내도 괜찮아요. 기준을 낮추는 게 아니라 여유칸을 넣는 거예요."
  },
  extra: {
    label: "외향성 (Extraversion)",
    name: "사람들 속에서 켜지는 사람",
    desc: "혼자 있는 시간이 길어지면 기운이 빠지고, 사람들과 부딪히면서 오히려 충전되는 편이에요. 분위기를 띄우고 먼저 말을 거는 역할이 자연스럽죠. 대신 조용히 혼자 정리하는 시간이 적어서, 생각보다 결정을 빨리 내려버리기도 해요.",
    tip: "중요한 결정은 사람들과 얘기한 다음, 혼자 하루 더 두고 보면 후회가 줄어요."
  },
  agree: {
    label: "우호성 (Agreeableness)",
    name: "먼저 맞춰주는 사람",
    desc: "누가 불편해 보이면 먼저 알아채고, 웬만하면 부딪히지 않는 쪽을 고르는 편이에요. 그래서 사람들 사이에서 ‘편한 사람’으로 통하죠. 문제는 그 배려가 늘 내 몫을 깎아서 나온다는 점이에요. 하고 싶은 말을 삼킨 게 나중에 서운함으로 남을 수 있어요.",
    tip: "거절이 관계를 깨는 일은 드물어요. ‘이번엔 어려워요’ 한 문장을 미리 준비해두면 훨씬 쉬워져요."
  },
  neuro: {
    label: "정서 민감성 (Neuroticism)",
    name: "감정 신호가 먼저 도는 사람",
    desc: "다른 사람은 지나치는 신호를 먼저 알아채고, 그게 마음에 오래 남는 편이에요. 세심하고 상황을 미리 대비하는 게 강점인데, 그만큼 안 일어난 일까지 미리 걱정하느라 에너지가 빨리 닳습니다. 예민한 게 약점이 아니라, 회복하는 방법이 아직 덜 정해진 상태일 수 있어요.",
    tip: "걱정이 도는 시간을 하루 10분으로 정해두고, 그 밖에서는 ‘아까 그 칸에서 생각하자’로 넘겨보세요."
  }
};

const traitOrder = ["open", "consc", "extra", "agree", "neuro"];
const barNames = { open:"개방성", consc:"성실성", extra:"외향성", agree:"우호성", neuro:"정서 민감성" };

const sourceText = "참고: 심리학에서 성격을 설명할 때 가장 널리 쓰이는 <b>성격 5요인(Big Five)</b> 모형을 바탕으로 재구성했어요. 원래 이 다섯 축은 각각 높낮이가 따로 있는 값인데, 여기서는 지금 가장 진하게 나온 결 하나를 보여주는 방식입니다. 공식 검사(NEO-PI 등)는 아니에요.";

let current = 0;
const scores = { open:0, consc:0, extra:0, agree:0, neuro:0 };

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  const quizEl = document.getElementById('quiz');

  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = '<div class="bubble them">' + q.them + '</div>';
  quizEl.appendChild(row);

  const answers = document.createElement('div');
  answers.className = 'answers';
  answers.id = 'answers-' + current;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val);
    answers.appendChild(btn);
  });
  quizEl.appendChild(answers);

  quizEl.scrollTop = quizEl.scrollHeight;
  document.getElementById('progressBar').style.width = ((current)/questions.length*100) + '%';
}

function selectAnswer(val){
  scores[val]++;
  document.getElementById('answers-' + current).remove();

  current++;
  document.getElementById('progressBar').style.width = (current/questions.length*100) + '%';

  if(current < questions.length){
    document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
    setTimeout(renderQuestion, 300);
  } else {
    document.getElementById('statusText').textContent = "결과 도착!";
    setTimeout(showResult, 400);
  }
}

// 동점이면 traitOrder 기준 앞선 축을 대표로 삼는다
function topTrait(){
  return traitOrder.reduce((best, k) => scores[k] > scores[best] ? k : best, traitOrder[0]);
}

function showResult(){
  const top = topTrait();
  const t = traits[top];
  document.getElementById('rTrait').textContent = t.label;
  document.getElementById('rName').textContent = t.name;
  document.getElementById('rDesc').textContent = t.desc;
  document.getElementById('rTip').innerHTML = '🧩 <b>이렇게 해보면 좋아요</b><br>' + t.tip;
  document.getElementById('rSource').innerHTML = sourceText;

  // 다섯 축 점수를 막대로 표시 (선택 수 / 총 문항 수 비율)
  const barsEl = document.getElementById('rBars');
  barsEl.innerHTML = traitOrder.map(k => {
    const pct = Math.round(scores[k] / questions.length * 100);
    return '<div class="bar-row">' +
      '<div class="bar-name">' + barNames[k] + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="bar-val">' + scores[k] + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function restartQuiz(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('statusText').textContent = '대화 중...';
}

function copyResult(){
  const toast = document.getElementById('copyToast');
  if(navigator.clipboard){
    navigator.clipboard.writeText(location.href).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
}
</script>
