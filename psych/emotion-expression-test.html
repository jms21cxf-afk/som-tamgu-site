<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나의 감정 표현 방식은? — 썸 탐구생활</title>
<meta name="description" content="화가 나거나 서운할 때 나는 말로 할까, 표정으로 낼까, 참을까, 돌려 말할까. 8가지 상황으로 알아보는 감정 표현 방식.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  /* 스트레스 테스트와 같은 틀, 색만 장미빛 갈색 계열로 */
  :root{
    --bg: #F8F3F1; --paper: #FFFFFF; --line: #E8DCD9;
    --ink: #33292B; --ink-soft: #7A6669;
    --rose:#A0616A; --rose-dark:#7D4A54;
    --coral:#FF6F59; --bubble-me: #F6E9E8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(160,97,106,0.12) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,111,89,0.06) 0%, transparent 40%);
    font-family: 'Gowun Dodum', sans-serif; color: var(--ink);
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px 12px;
  }
  .display{ font-family:'Gaegu', 'Gowun Dodum', sans-serif; }
  .crumb-bar{
    width:100%; max-width:400px; margin: 0 auto 12px;
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size: 13px;
  }
  .crumb-bar a{ color:#8A5A1F; text-decoration:none; }
  .crumb-bar span{ color:#B4ABA0; }
  .crumb-bar .current{ color:#3A2E39; }

  .phone{
    width: 100%; max-width: 400px; background: var(--paper); border-radius: 32px;
    border: 1px solid var(--line); box-shadow: 0 20px 50px -20px rgba(51,41,43,0.25), 0 4px 12px rgba(51,41,43,0.06);
    overflow: hidden; position: relative; min-height: 640px; display:flex; flex-direction:column;
  }
  .phone-header{ padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap: 10px; }
  .avatar{ width: 38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--rose), var(--coral)); display:flex; align-items:center; justify-content:center; font-size: 18px; flex-shrink:0; }
  .header-text .name{ font-weight:700; font-size:15px; }
  .header-text .status{ font-size:11.5px; color: var(--ink-soft); }
  .progress-wrap{ height: 4px; background: var(--line); position: relative; z-index: 2; }
  .progress-bar{ height:100%; width: 0%; background: var(--rose-dark); transition: width 0.4s ease; }

  .screen{ flex:1; display:flex; flex-direction:column; padding: 22px 18px; overflow-y:auto; position:relative; }
  .hidden{ display:none !important; }

  #intro{ align-items:center; justify-content:center; text-align:center; gap:16px; flex:1; }
  #intro .big-emoji{ font-size: 52px; }
  #intro h1{ font-size: 24px; line-height:1.4; }
  #intro p{ font-size: 14px; color: var(--ink-soft); line-height:1.6; padding: 0 4px; }
  .cta-btn{
    margin-top: 10px; background: var(--rose-dark); color: white; border:none; padding: 14px 32px;
    border-radius: 999px; font-size: 15px; font-weight: 700; cursor:pointer;
    box-shadow: 0 8px 16px -6px rgba(125,74,84,0.4);
  }
  .cta-btn:active{ transform: scale(0.96); }
  .meta-note{ font-size: 11.5px; color:#B3A3A5; margin-top:4px; }

  #quiz{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
  .bubble-row{ display:flex; margin-bottom: 4px; }
  .bubble{ max-width: 86%; padding: 12px 16px; border-radius: 18px; font-size: 14.2px; line-height:1.55; animation: pop 0.25s ease; }
  @keyframes pop{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:translateY(0);} }
  .bubble.them{ background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .answers{ display:flex; flex-direction:column; gap:8px; margin-top: 4px; }
  .answer-btn{
    align-self: flex-end; max-width: 90%; text-align:left; background: var(--bubble-me);
    border: 1px solid #E3C9C8; color: var(--ink); padding: 10px 16px; border-radius: 16px;
    border-bottom-right-radius: 4px; font-size: 13.5px; line-height:1.5; cursor:pointer;
  }
  .answer-btn:hover{ background:#F0DCDA; }
  .answer-btn:active{ transform: scale(0.98); }

  #result{ align-items:center; text-align:center; gap:10px; flex:1; justify-content:center; }
  .result-card{
    width:100%; background: linear-gradient(180deg, #FFFDFB, #F8F3F1); border: 1px solid var(--line);
    border-radius: 22px; padding: 26px 20px 22px; position:relative; box-shadow: 0 10px 24px -14px rgba(51,41,43,0.2);
  }
  .type-tag{ display:inline-block; background: var(--ink); color: white; font-size: 11px; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
  .type-name{ font-size: 22px; font-weight:700; line-height:1.3; margin-bottom: 14px; }
  .type-desc{ font-size: 13.5px; line-height:1.7; color: var(--ink); text-align:left; }
  .tip-box{
    margin-top:16px; background: var(--paper); border: 1px dashed var(--line); border-radius: 14px;
    padding: 12px 14px; text-align:left; font-size: 12.5px; color: var(--ink-soft); line-height:1.6;
  }
  .tip-box b{ color: var(--rose-dark); }
  .read-more{ margin-top:14px; display:inline-block; font-size:12.5px; color: var(--ink-soft); text-decoration:underline; }
  .action-row{ display:flex; gap:8px; width:100%; margin-top: 16px; }
  .action-btn{ flex:1; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight:700; cursor:pointer; border: none; }
  .action-btn.share{ background: var(--ink); color:white; }
  .action-btn.restart{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .copy-toast{
    position:absolute; bottom: -6px; left:50%; transform: translateX(-50%) translateY(100%);
    background: var(--ink); color:white; font-size:12px; padding: 8px 14px; border-radius: 999px;
    opacity:0; transition: opacity 0.25s ease; white-space:nowrap;
  }
  .copy-toast.show{ opacity:1; }
</style>
</head>
<body>

<div style="width:100%; display:flex; justify-content:center;">
<div style="width:100%; max-width:400px;">
<div class="crumb-bar"><a href="../index.html">탐구소</a><span>/</span><a href="index.html" class="current">심리</a></div>
<div class="phone">
  <div class="phone-header">
    <div class="avatar">🎭</div>
    <div class="header-text">
      <div class="name display">감정 표현 진단소</div>
      <div class="status" id="statusText">대화 중...</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- INTRO -->
  <div id="intro" class="screen">
    <div class="big-emoji">🎭</div>
    <h1 class="display">화가 나면, 서운하면,<br>나는 어떻게 드러낼까?</h1>
    <p>감정이 생기는 순간 8가지에 답하면<br>내가 감정을 밖으로 내는 방식을 알려줄게요.</p>
    <button class="cta-btn" onclick="startQuiz()">시작하기 →</button>
    <div class="meta-note">약 40초 소요 · 진단이 아닌 자기 이해용 테스트예요</div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen hidden"></div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="result-card" id="resultCard">
      <span class="type-tag">RESULT</span>
      <div class="type-name display" id="rName"></div>
      <div class="type-desc" id="rDesc"></div>
      <div class="tip-box" id="rTip"></div>
      <a class="read-more" href="insights/why-do-i-pretend-to-be-fine-when-angry.html">왜 화가 났는데 괜찮은 척하게 될까? →</a>
      <div class="copy-toast" id="copyToast">링크가 복사됐어요!</div>
    </div>
    <div class="action-row">
      <button class="action-btn share" onclick="copyResult()">결과 공유하기</button>
      <button class="action-btn restart" onclick="restartQuiz()">다시하기</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
// 네 가지 표현 방식: direct(말로) / show(표정·행동으로) / hold(참고) / hint(돌려서)
const questions = [
  { them: "친구가 약속에 30분 늦었는데 미안하다는 말이 없다. 나는", options:[
      {text:"\"늦으면 미리 말해줘야지\" 하고 바로 말한다", val:"direct"},
      {text:"말은 안 하는데 표정과 말투가 평소와 달라진다", val:"show"},
      {text:"\"괜찮아, 나도 방금 왔어\" 하고 넘긴다", val:"hold"},
      {text:"\"오늘 진짜 여유롭네~\" 하고 농담처럼 찌른다", val:"hint"}
    ]},
  { them: "회의에서 내 아이디어가 다른 사람 이름으로 나갔다", options:[
      {text:"회의 끝나고 바로 \"그거 제가 낸 건데요\" 말한다", val:"direct"},
      {text:"남은 시간 내내 말수가 줄고 팔짱을 끼게 된다", val:"show"},
      {text:"그 자리에선 넘기고 집에서 혼자 곱씹는다", val:"hold"},
      {text:"\"어디서 많이 들어본 아이디어네요\" 하고 웃으며 던진다", val:"hint"}
    ]},
  { them: "반대로 기분이 아주 좋은 날, 나는", options:[
      {text:"\"오늘 진짜 기분 좋다!\" 하고 바로 말한다", val:"direct"},
      {text:"말은 안 해도 콧노래가 나오고 걸음이 달라진다", val:"show"},
      {text:"좋아도 티를 잘 안 낸다. 평소랑 비슷하다", val:"hold"},
      {text:"괜히 커피를 돌리거나 장난을 치게 된다", val:"hint"}
    ]},
  { them: "연인이 내 기분을 몰라줄 때", options:[
      {text:"\"나 지금 서운해\" 라고 말한다", val:"direct"},
      {text:"대답이 짧아지고 연락 텀이 길어진다", val:"show"},
      {text:"들키지 않으려고 오히려 더 밝게 행동한다", val:"hold"},
      {text:"\"너는 좋겠다, 신경 쓸 게 없어서\" 한마디 던진다", val:"hint"}
    ]},
  { them: "누가 \"너 괜찮아?\" 하고 물으면", options:[
      {text:"안 괜찮으면 안 괜찮다고 말한다", val:"direct"},
      {text:"\"응\" 하고 답하지만 표정에 이미 다 보인다", val:"show"},
      {text:"무슨 일이 있어도 \"괜찮아\"가 먼저 나온다", val:"hold"},
      {text:"\"안 괜찮으면 어쩔 건데?\" 하고 농담으로 넘긴다", val:"hint"}
    ]},
  { them: "화가 났던 일을 나중에 떠올리면", options:[
      {text:"이미 말했기 때문에 크게 남는 게 없다", val:"direct"},
      {text:"그 사람을 보면 몸이 먼저 굳는다", val:"show"},
      {text:"'그때 왜 아무 말도 못 했지' 하고 후회가 남는다", val:"hold"},
      {text:"그때 던진 말이 너무 셌나 괜히 신경 쓰인다", val:"hint"}
    ]},
  { them: "주변 사람들이 나에 대해 자주 하는 말은", options:[
      {text:"\"너는 솔직해서 편해\"", val:"direct"},
      {text:"\"너 오늘 무슨 일 있지? 다 티 나\"", val:"show"},
      {text:"\"너는 무슨 생각 하는지 모르겠어\"", val:"hold"},
      {text:"\"그거 진심이야, 농담이야?\"", val:"hint"}
    ]},
  { them: "마지막 질문. 감정을 표현한 뒤 드는 기분은?", options:[
      {text:"시원하다. 말하고 나면 정리된다", val:"direct"},
      {text:"표현했다는 느낌은 없다. 상대가 알아챈 것뿐", val:"show"},
      {text:"표현 자체를 거의 안 해서 잘 모르겠다", val:"hold"},
      {text:"전달됐는지 안 됐는지 헷갈려서 뒤가 찜찜하다", val:"hint"}
    ]}
];

const results = {
  direct:{ name:"바로 말하는형", desc:"감정이 생기면 오래 담아두지 않고 말로 꺼내는 타입이에요. 상대가 내 상태를 바로 알 수 있어서 오해가 적고, 안에 쌓이는 것도 적어요. 다만 상대가 준비되지 않은 순간에 나오면 내용은 맞아도 세게 들릴 수 있어요.", tip:"말하기 전에 한 박자만. '지금 말해도 괜찮은 타이밍인가' 한 번 확인해보세요. 내용은 그대로여도 받는 쪽이 달라져요." },
  show:{ name:"표정으로 말하는형", desc:"말은 안 해도 표정, 말투, 연락 텀으로 감정이 새어 나오는 타입이에요. 숨기려 해도 주변은 이미 알아요. 문제는 상대가 '무슨 일이 있다'는 건 알아도 '무엇 때문인지'는 모른다는 거예요. 그래서 상대를 눈치 보게 만들 수 있어요.", tip:"티가 난 뒤에 한 문장만 덧붙여보세요. \"아까 그 말이 좀 서운했어.\" 상대가 추측하는 대신 알게 돼요." },
  hold:{ name:"괜찮은 척형", desc:"감정이 생겨도 겉으로는 평소와 같은 타입이에요. 분위기를 지키고 관계를 흔들지 않는 힘이 있어요. 다만 밖으로 나가지 못한 감정은 안에 남아서, 혼자 있을 때 다시 올라오거나 전혀 다른 곳에서 터질 수 있어요. 상대는 정말 괜찮은 줄 알아서 같은 일이 반복되기도 해요.", tip:"말하지 않기로 했다면 그것도 괜찮아요. 대신 나한테는 솔직해지기. '나 지금 화났다'고 속으로 이름만 붙여보세요." },
  hint:{ name:"돌려 말하는형", desc:"감정을 농담, 비유, 짧은 한마디로 살짝 던지는 타입이에요. 분위기를 깨지 않으면서 신호를 보내는 재주가 있어요. 다만 상대가 못 알아채면 '말했는데 안 들어줬다'가 되고, 알아채면 '왜 저렇게 말하지'가 될 수 있어요.", tip:"중요한 감정일수록 한 번은 직진으로. 농담 뒤에 \"사실 진심이야\" 한마디만 붙여도 전달력이 달라져요." }
};

let current = 0;
const scores = { direct:0, show:0, hold:0, hint:0 };

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
  renderQuestion();
}

// 질문 말풍선과 답변 버튼을 채팅처럼 아래에 붙인다
function renderQuestion(){
  const q = questions[current];
  const quizEl = document.getElementById('quiz');

  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = '<div class="bubble them">' + q.them + '</div>';
  quizEl.appendChild(row);

  const answers = document.createElement('div');
  answers.className = 'answers';
  answers.id = 'answers-' + current;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val);
    answers.appendChild(btn);
  });
  quizEl.appendChild(answers);

  quizEl.scrollTop = quizEl.scrollHeight;
  document.getElementById('progressBar').style.width = ((current)/questions.length*100) + '%';
}

function selectAnswer(val){
  scores[val]++;
  document.getElementById('answers-' + current).remove();

  current++;
  document.getElementById('progressBar').style.width = (current/questions.length*100) + '%';

  if(current < questions.length){
    document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
    setTimeout(renderQuestion, 300);
  } else {
    document.getElementById('statusText').textContent = "결과 도착!";
    setTimeout(showResult, 400);
  }
}

// 점수가 가장 높은 유형을 결과로 보여준다 (동점이면 앞선 순서 우선)
function showResult(){
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = results[top];
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rTip').innerHTML = '🎭 <b>이럴 때 도움돼요</b><br>' + r.tip;

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function restartQuiz(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('statusText').textContent = '대화 중...';
}

function copyResult(){
  // 결과 이름 한 줄, 주소 한 줄만 복사한다
  const text = document.getElementById('rName').textContent + '\n' + location.href;
  const toast = document.getElementById('copyToast');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
}
</script>

</body>
</html>
