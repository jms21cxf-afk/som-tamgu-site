<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>썸 탐구생활 — MBTI 연애 유형 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF6F1;
    --paper: #FFFFFF;
    --line: #F0DED8;
    --ink: #3A2E39;
    --ink-soft: #7A6B72;
    --coral: #FF6F59;
    --coral-dark: #E85A45;
    --mustard: #F2B705;
    --teal: #4E9F8B;
    --bubble-me: #FFEDE8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(242,183,5,0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(78,159,139,0.08) 0%, transparent 40%);
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 12px;
  }
  .display{ font-family:'Gaegu', 'Gowun Dodum', sans-serif; }

  /* ---- phone frame ---- */
  .phone{
    width: 100%;
    max-width: 400px;
    background: var(--paper);
    border-radius: 32px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px -20px rgba(58,46,57,0.25), 0 4px 12px rgba(58,46,57,0.06);
    overflow: hidden;
    position: relative;
    min-height: 640px;
    display:flex;
    flex-direction:column;
  }
  .phone-header{
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--paper);
    position: relative;
    z-index: 2;
  }
  .avatar{
    width: 38px; height:38px; border-radius:50%;
    background: linear-gradient(135deg, var(--coral), var(--mustard));
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    flex-shrink:0;
  }
  .header-text .name{ font-weight:700; font-size:15px; }
  .header-text .status{ font-size:11.5px; color: var(--ink-soft); }
  .progress-wrap{
    height: 4px;
    background: var(--line);
    position: relative;
    z-index: 2;
  }
  .progress-bar{
    height:100%;
    width: 0%;
    background: var(--coral);
    transition: width 0.4s ease;
  }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 22px 18px;
    overflow-y:auto;
    position:relative;
  }
  .hidden{ display:none !important; }

  /* ---- intro ---- */
  #intro{ align-items:center; justify-content:center; text-align:center; gap:16px; flex:1; }
  #intro .big-emoji{ font-size: 52px; }
  #intro h1{ font-size: 26px; line-height:1.3; }
  #intro p{ font-size: 14px; color: var(--ink-soft); line-height:1.6; padding: 0 6px; }
  .cta-btn{
    margin-top: 10px;
    background: var(--coral);
    color: white;
    border:none;
    padding: 14px 32px;
    border-radius: 999px;
    font-family:'Gowun Dodum', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor:pointer;
    box-shadow: 0 8px 16px -6px rgba(255,111,89,0.5);
    transition: transform 0.15s ease;
  }
  .cta-btn:active{ transform: scale(0.96); }
  .meta-note{ font-size: 11.5px; color:#B7A9AE; margin-top:4px; }

  /* ---- ad slot ---- */
  .ad-slot{
    margin: 14px 0 0;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 10px;
    text-align:center;
    font-size: 10.5px;
    color: #C9BDC2;
    letter-spacing: 0.03em;
  }

  /* ---- quiz ---- */
  #quiz{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
  .bubble-row{ display:flex; margin-bottom: 4px; }
  .bubble{
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height:1.5;
    animation: pop 0.25s ease;
  }
  @keyframes pop{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:translateY(0);} }
  .bubble.them{
    background: var(--paper);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .bubble.me{
    background: var(--coral);
    color: white;
    border-bottom-right-radius: 4px;
    margin-left:auto;
  }
  .answers{ display:flex; flex-direction:column; gap:8px; margin-top: 4px; }
  .answer-btn{
    align-self: flex-end;
    max-width: 88%;
    text-align:left;
    background: var(--bubble-me);
    border: 1px solid #FFD9CC;
    color: var(--ink);
    padding: 11px 16px;
    border-radius: 16px;
    border-bottom-right-radius: 4px;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 13.8px;
    line-height:1.5;
    cursor:pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .answer-btn:hover{ background:#FFDCCF; }
  .answer-btn:active{ transform: scale(0.98); }

  /* ---- result ---- */
  #result{ align-items:center; text-align:center; gap:10px; flex:1; justify-content:center; }
  .result-card{
    width:100%;
    background: linear-gradient(180deg, #FFFDFB, #FFF6F1);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px 20px 22px;
    position:relative;
    box-shadow: 0 10px 24px -14px rgba(58,46,57,0.2);
  }
  .type-tag{
    display:inline-block;
    background: var(--ink);
    color: white;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .type-name{ font-size: 24px; font-weight:700; line-height:1.3; margin-bottom: 6px; }
  .type-mbti{ font-size: 12.5px; color: var(--coral-dark); font-weight:700; letter-spacing:0.05em; margin-bottom: 14px;}
  .type-desc{ font-size: 13.8px; line-height:1.65; color: var(--ink); text-align:left; }
  .match-box{
    margin-top:16px;
    background: var(--paper);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    text-align:left;
    font-size: 12.8px;
  }
  .match-box b{ color: var(--teal); }
  .watch-line{
    margin-top:10px; text-align:left; font-size:12px; color: var(--ink-soft);
    padding-left:10px; border-left:2px solid var(--coral);
  }
  .action-row{ display:flex; gap:8px; width:100%; margin-top: 16px; }
  .action-btn{
    flex:1;
    border-radius: 14px;
    padding: 12px 8px;
    font-size: 13px;
    font-family:'Gowun Dodum', sans-serif;
    font-weight:700;
    cursor:pointer;
    border: none;
  }
  .action-btn.share{ background: var(--ink); color:white; }
  .action-btn.restart{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .read-more{
    margin-top:14px; display:inline-block; font-size:12.5px; color: var(--ink-soft); text-decoration:underline;
  }
  .copy-toast{
    position:absolute;
    bottom: -6px;
    left:50%;
    transform: translateX(-50%) translateY(100%);
    background: var(--ink);
    color:white;
    font-size:12px;
    padding: 8px 14px;
    border-radius: 999px;
    opacity:0;
    transition: opacity 0.25s ease;
    white-space:nowrap;
  }
  .copy-toast.show{ opacity:1; }
  .top-nav{
    width:100%; max-width:400px; margin: 0 auto 10px; text-align:left;
    font-family:'Gowun Dodum', sans-serif; font-size: 13px;
  }
  .top-nav a{ color: var(--ink-soft); text-decoration:none; }

  /* 페이지 위치 표시 줄 */
  .crumb-bar{
    width:100%; max-width:400px; margin: 0 auto 12px;
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size: 13px;
  }
  .crumb-bar a{ color:#A87E3F; text-decoration:none; }
  .crumb-bar span{ color:#B4ABA0; }
  .crumb-bar .current{ color:#3A2E39; }

</style>
</head>
<body>

<div style="width:100%; display:flex; justify-content:center;">
<div style="width:100%; max-width:400px;">
<div class="crumb-bar">
  <a href="../index.html">탐구소</a>
  <span>/</span>
  <a href="index.html" class="current">심리</a>
</div>
<div class="phone">
  <div class="phone-header">
    <div class="avatar">💌</div>
    <div class="header-text">
      <div class="name display">썸 탐구생활</div>
      <div class="status" id="statusText">대화 중...</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- INTRO -->
  <div id="intro" class="screen">
    <div class="big-emoji">💬</div>
    <h1 class="display">나의 연애 스타일,<br>MBTI로 알아볼까?</h1>
    <p>썸 상황 8가지에 답하면<br>당신의 MBTI 연애 유형과 찰떡궁합을 알려줄게요.</p>
    <button class="cta-btn" onclick="startQuiz()">대화 시작하기 →</button>
    <div class="meta-note">약 40초 소요 · 결과는 저장해서 공유할 수 있어요</div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen hidden"></div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="result-card" id="resultCard">
      <span class="type-tag">RESULT</span>
      <div class="type-name display" id="rName"></div>
      <div class="type-mbti" id="rMbti"></div>
      <div class="type-desc" id="rDesc"></div>
      <div class="match-box" id="rMatch"></div>
      <div class="watch-line" id="rWatch"></div>
      <a class="read-more" href="articles/mbti-compatibility.html">MBTI 궁합, 정말 근거가 있을까? →</a>
      <div class="copy-toast" id="copyToast">링크가 복사됐어요!</div>
    </div>
    <div class="action-row">
      <button class="action-btn share" onclick="copyResult()">결과 공유하기</button>
      <button class="action-btn restart" onclick="restartQuiz()">다시하기</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
const questions = [
  { them: "썸 상대가 갑자기 \"우리 오늘 뭐하지?\" 라고 물어봤어요.", axis:"EI",
    options: [
      { text: "\"그냥 나와! 재밌는 데 많아 ㅎㅎ\"", val:"E" },
      { text: "\"음... 너는 뭐하고 싶은데?\"", val:"I" }
    ]},
  { them: "소개팅에서 처음 만난 사람과 단둘이 있어요.", axis:"EI",
    options: [
      { text: "이것저것 물어보며 분위기를 이끈다", val:"E" },
      { text: "상대가 편해질 때까지 조용히 지켜본다", val:"I" }
    ]},
  { them: "썸 상대가 요즘 연락이 좀 뜸해졌어요.", axis:"SN",
    options: [
      { text: "최근에 있었던 일들을 하나하나 되짚어본다", val:"S" },
      { text: "\"혹시 마음이 식은 건 아닐까...\" 온갖 상상을 한다", val:"N" }
    ]},
  { them: "연애할 때 나는 상대를 이렇게 봐요.", axis:"SN",
    options: [
      { text: "말과 행동, 있는 그대로를 본다", val:"S" },
      { text: "사소한 행동 속에 숨은 의미를 찾으려 한다", val:"N" }
    ]},
  { them: "썸 상대가 힘든 일을 털어놓았어요.", axis:"TF",
    options: [
      { text: "원인을 분석하고 해결책을 제시한다", val:"T" },
      { text: "\"많이 힘들었겠다\"며 마음부터 헤아린다", val:"F" }
    ]},
  { them: "연인과 다투게 됐을 때, 나는", axis:"TF",
    options: [
      { text: "감정보다 누구 말이 맞는지 논리적으로 짚는다", val:"T" },
      { text: "상대 기분이 상하지 않게 먼저 조율한다", val:"F" }
    ]},
  { them: "데이트 코스, 어떻게 짜는 편이에요?", axis:"JP",
    options: [
      { text: "시간대별로 미리 계획해둔다", val:"J" },
      { text: "그때그때 기분 따라 정한다", val:"P" }
    ]},
  { them: "밀당에 대한 내 생각은?", axis:"JP",
    options: [
      { text: "어느 정도 정해진 타이밍과 룰이 있다고 생각한다", val:"J" },
      { text: "흐름 따라 자연스럽게 흘러가면 된다고 생각한다", val:"P" }
    ]}
];

const results = {
  INFP:{name:"시 쓰는 짝사랑꾼", desc:"마음속엔 이미 소설 한 편이 완성돼 있어요. 좋아하는 사람의 사소한 습관 하나까지 곱씹으면서 혼자 의미를 부여하곤 하죠. 표현은 서툴지만, 그 감정의 깊이만큼은 누구에게도 지지 않아요.", match:"ENFJ, ENTJ", watch:"혼자 상상만 키우다 정작 고백 타이밍을 놓치는 경우가 많아요."},
  ENFP:{name:"고백 폭죽러", desc:"마음에 확신이 서면 못 참아요. 텐션 넘치는 리액션으로 상대를 웃게 만드는 분위기 메이커라, 있는 것만으로 연애가 재밌어져요.", match:"INTJ, INFJ", watch:"급발진한 다음 상대 반응이 미지근하면 스스로 크게 상처받는 편이에요."},
  INTJ:{name:"밀당의 마스터플래너", desc:"연애도 프로젝트처럼 접근해요. 감정보다 확신이 먼저 서야 움직이는 신중파라서, 주변에서는 '쟤 관심 있는 거 맞아?' 싶을 정도로 티가 안 나요.", match:"ENFP, ENTP", watch:"너무 계산하다가 정작 마음을 표현할 결정적 순간을 계속 미루게 돼요."},
  ENTJ:{name:"연애도 KPI 달성형", desc:"목표가 생기면 저돌적으로 다가가는 타입이에요. 밀당보다는 화끈한 직진, 애매한 관계보다는 확실한 답을 원해요.", match:"INFP, INFJ", watch:"상대 속도를 못 기다려주고 밀어붙이다 부담을 줄 수 있어요."},
  INFJ:{name:"속마음 다이어리형", desc:"겉으론 잔잔하지만, 속으론 상대의 말 한마디 표정 하나까지 다 기억하고 곱씹어요. 한번 마음을 주면 오래, 깊게 가요.", match:"ENTP, ENFP", watch:"혼자 다 이해하고 넘어가려다 정작 서운함을 제때 말 못 해요."},
  ENFJ:{name:"우리 편 사랑꾼", desc:"상대를 챙기고 응원하는 게 곧 연애의 기쁨이에요. 상대의 성장까지 함께 바라는, 곁에 있으면 든든한 사람이에요.", match:"INFP, ISFP", watch:"상대를 챙기느라 정작 본인 감정은 뒷전이 되기 쉬워요."},
  INTP:{name:"썸도 분석하는 사람", desc:"좋아한다는 감정조차 논리적으로 이해하려 들어요. \"이게 정말 좋아하는 감정 맞나?\" 스스로 검증부터 하다 보니 확신이 서기 전까진 아무 티도 안 나요.", match:"ENTJ, ESTJ", watch:"분석만 하다 상대가 먼저 지쳐 떠나는 경우가 종종 있어요."},
  ENTP:{name:"썸 게임의 신", desc:"밀당 자체를 게임처럼 즐겨요. 대화 하나로 상대를 끌어당기는 데 능하고, 예측 불가능한 매력으로 계속 궁금하게 만들어요.", match:"INFJ, INTJ", watch:"장난이 길어지면 상대는 진심인지 몰라 지칠 수 있어요."},
  ISFP:{name:"무드등 같은 사람", desc:"화려하진 않아도 옆에 있으면 마음이 편안해지는 타입이에요. 큰 이벤트보다 조용한 배려로 진심을 보여줘요.", match:"ENFJ, ESFJ", watch:"표현이 워낙 적어서 상대가 마음을 못 알아챌 때가 많아요."},
  ESFP:{name:"연애는 축제다", desc:"함께 있는 모든 순간을 재밌게 만드는 사람이에요. 리액션도 애정 표현도 화끈해서, 옆에 있으면 심심할 틈이 없어요.", match:"ISTJ, ISFJ", watch:"들뜬 기분이 가라앉으면 관심도 같이 식어 보일 수 있어요."},
  ISTP:{name:"무심한 츤데레", desc:"말보다 행동으로 챙기는 편이에요. \"딱히 신경 안 써\"라고 하면서 결국 다 챙기고 있는, 은근함의 정석이에요.", match:"ESFJ, ESTJ", watch:"무심한 태도가 진짜 무관심으로 오해받을 수 있어요."},
  ESTP:{name:"직진남 직진녀", desc:"밀당보단 직진이 진리라고 믿어요. 마음이 생기면 그 자리에서 바로 행동으로 보여주는, 눈치 게임 없는 화끈한 스타일.", match:"ISFJ, ISTJ", watch:"속도 조절 없이 밀어붙이면 상대가 부담스러워할 수 있어요."},
  ISFJ:{name:"다정한 집사형", desc:"말하지 않아도 필요한 걸 먼저 챙겨주는 사람이에요. 헌신적이고 세심한 연애를 하지만, 정작 본인이 뭘 원하는지는 잘 말 안 해요.", match:"ESFP, ESTP", watch:"계속 맞춰주다 보면 스스로 지치는 걸 늦게 알아차려요."},
  ESFJ:{name:"우리 사이 매니저", desc:"관계를 세심하게 관리하고 기념일도 놓치지 않는 타입이에요. 함께하는 사람들과의 조화를 무엇보다 중요하게 여겨요.", match:"ISFP, ISTP", watch:"관계를 완벽하게 관리하려다 스스로 부담을 짊어질 수 있어요."},
  ISTJ:{name:"한결같은 뚝심러", desc:"한번 마음을 주면 웬만해선 흔들리지 않아요. 표현은 담백해도, 신뢰만큼은 누구보다 확실하게 지켜요.", match:"ESFP, ENFP", watch:"변화가 없다 보니 상대는 권태기로 착각할 수 있어요."},
  ESTJ:{name:"연애도 계획표형", desc:"관계의 방향과 미래까지 구체적으로 그리는 타입이에요. 애매한 것보다 확실한 걸 좋아하고, 계획이 서면 흔들림 없이 밀고 나가요.", match:"ISFP, INFP", watch:"계획대로 안 흘러가면 스트레스를 많이 받는 편이에요."}
};

const resultsLen = Object.keys(results).length;

let current = 0;
const scores = { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0 };

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  const quizEl = document.getElementById('quiz');

  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = '<div class="bubble them">' + q.them + '</div>';
  quizEl.appendChild(row);

  const answers = document.createElement('div');
  answers.className = 'answers';
  answers.id = 'answers-' + current;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val, opt.text);
    answers.appendChild(btn);
  });
  quizEl.appendChild(answers);

  quizEl.scrollTop = quizEl.scrollHeight;
  document.getElementById('progressBar').style.width = ((current)/questions.length*100) + '%';
}

function selectAnswer(val, text){
  scores[val]++;
  document.getElementById('answers-' + current).remove();

  const quizEl = document.getElementById('quiz');
  const meRow = document.createElement('div');
  meRow.className = 'bubble-row';
  meRow.innerHTML = '<div class="bubble me">' + text + '</div>';
  quizEl.appendChild(meRow);
  quizEl.scrollTop = quizEl.scrollHeight;

  current++;
  document.getElementById('progressBar').style.width = (current/questions.length*100) + '%';

  if(current < questions.length){
    document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
    setTimeout(renderQuestion, 350);
  } else {
    document.getElementById('statusText').textContent = "결과 도착!";
    setTimeout(showResult, 500);
  }
}

function showResult(){
  const mbti =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');

  const r = results[mbti];
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rMbti').textContent = mbti + " · 연애 유형";
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rMatch').innerHTML = '💘 찰떡궁합: <b>' + r.match + '</b>';
  document.getElementById('rWatch').textContent = '⚠️ ' + r.watch;

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function restartQuiz(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('statusText').textContent = '대화 중...';
}

function copyResult(){
  // 결과 이름 한 줄, 주소 한 줄만 복사한다
  const text = document.getElementById('rName').textContent + '\n' + location.href;
  const toast = document.getElementById('copyToast');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
}
</script>
