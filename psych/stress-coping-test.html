<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나의 스트레스 대처 유형은? — 썸 탐구생활</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F4F8; --paper: #FFFFFF; --line: #DCE3EC;
    --ink: #262B36; --ink-soft: #5C6779;
    --slate:#4A6FA5; --slate-dark:#37527D;
    --coral:#FF6F59; --bubble-me: #E7EDF6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(74,111,165,0.10) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,111,89,0.06) 0%, transparent 40%);
    font-family: 'Gowun Dodum', sans-serif; color: var(--ink);
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px 12px;
  }
  .display{ font-family:'Gaegu', 'Gowun Dodum', sans-serif; }
  .crumb-bar{
    width:100%; max-width:400px; margin: 0 auto 12px;
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size: 13px;
  }
  .crumb-bar a{ color:#8A5A1F; text-decoration:none; }
  .crumb-bar span{ color:#B4ABA0; }
  .crumb-bar .current{ color:#3A2E39; }

  .phone{
    width: 100%; max-width: 400px; background: var(--paper); border-radius: 32px;
    border: 1px solid var(--line); box-shadow: 0 20px 50px -20px rgba(38,43,54,0.25), 0 4px 12px rgba(38,43,54,0.06);
    overflow: hidden; position: relative; min-height: 640px; display:flex; flex-direction:column;
  }
  .phone-header{ padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap: 10px; }
  .avatar{ width: 38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--slate), var(--coral)); display:flex; align-items:center; justify-content:center; font-size: 18px; flex-shrink:0; }
  .header-text .name{ font-weight:700; font-size:15px; }
  .header-text .status{ font-size:11.5px; color: var(--ink-soft); }
  .progress-wrap{ height: 4px; background: var(--line); position: relative; z-index: 2; }
  .progress-bar{ height:100%; width: 0%; background: var(--slate-dark); transition: width 0.4s ease; }

  .screen{ flex:1; display:flex; flex-direction:column; padding: 22px 18px; overflow-y:auto; position:relative; }
  .hidden{ display:none !important; }

  #intro{ align-items:center; justify-content:center; text-align:center; gap:16px; flex:1; }
  #intro .big-emoji{ font-size: 52px; }
  #intro h1{ font-size: 24px; line-height:1.4; }
  #intro p{ font-size: 14px; color: var(--ink-soft); line-height:1.6; padding: 0 4px; }
  .cta-btn{
    margin-top: 10px; background: var(--slate-dark); color: white; border:none; padding: 14px 32px;
    border-radius: 999px; font-size: 15px; font-weight: 700; cursor:pointer;
    box-shadow: 0 8px 16px -6px rgba(55,82,125,0.4);
  }
  .cta-btn:active{ transform: scale(0.96); }
  .meta-note{ font-size: 11.5px; color:#A7AFBB; margin-top:4px; }

  #quiz{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
  .bubble-row{ display:flex; margin-bottom: 4px; }
  .bubble{ max-width: 86%; padding: 12px 16px; border-radius: 18px; font-size: 14.2px; line-height:1.55; animation: pop 0.25s ease; }
  @keyframes pop{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:translateY(0);} }
  .bubble.them{ background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .answers{ display:flex; flex-direction:column; gap:8px; margin-top: 4px; }
  .answer-btn{
    align-self: flex-end; max-width: 90%; text-align:left; background: var(--bubble-me);
    border: 1px solid #C9D6E8; color: var(--ink); padding: 10px 16px; border-radius: 16px;
    border-bottom-right-radius: 4px; font-size: 13.5px; line-height:1.5; cursor:pointer;
  }
  .answer-btn:hover{ background:#D9E3F1; }
  .answer-btn:active{ transform: scale(0.98); }

  #result{ align-items:center; text-align:center; gap:10px; flex:1; justify-content:center; }
  .result-card{
    width:100%; background: linear-gradient(180deg, #FFFDFB, #F1F4F8); border: 1px solid var(--line);
    border-radius: 22px; padding: 26px 20px 22px; position:relative; box-shadow: 0 10px 24px -14px rgba(38,43,54,0.2);
  }
  .type-tag{ display:inline-block; background: var(--ink); color: white; font-size: 11px; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
  .type-name{ font-size: 22px; font-weight:700; line-height:1.3; margin-bottom: 14px; }
  .type-desc{ font-size: 13.5px; line-height:1.7; color: var(--ink); text-align:left; }
  .tip-box{
    margin-top:16px; background: var(--paper); border: 1px dashed var(--line); border-radius: 14px;
    padding: 12px 14px; text-align:left; font-size: 12.5px; color: var(--ink-soft); line-height:1.6;
  }
  .tip-box b{ color: var(--slate-dark); }
  .read-more{ margin-top:14px; display:inline-block; font-size:12.5px; color: var(--ink-soft); text-decoration:underline; }
  .action-row{ display:flex; gap:8px; width:100%; margin-top: 16px; }
  .action-btn{ flex:1; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-weight:700; cursor:pointer; border: none; }
  .action-btn.share{ background: var(--ink); color:white; }
  .action-btn.restart{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .copy-toast{
    position:absolute; bottom: -6px; left:50%; transform: translateX(-50%) translateY(100%);
    background: var(--ink); color:white; font-size:12px; padding: 8px 14px; border-radius: 999px;
    opacity:0; transition: opacity 0.25s ease; white-space:nowrap;
  }
  .copy-toast.show{ opacity:1; }
</style>
</head>
<body>

<div style="width:100%; display:flex; justify-content:center;">
<div style="width:100%; max-width:400px;">
<div class="crumb-bar"><a href="../index.html">탐구소</a><span>/</span><span class="current">심리</span></div>
<div class="phone">
  <div class="phone-header">
    <div class="avatar">🌊</div>
    <div class="header-text">
      <div class="name display">스트레스 진단소</div>
      <div class="status" id="statusText">대화 중...</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- INTRO -->
  <div id="intro" class="screen">
    <div class="big-emoji">🌊</div>
    <h1 class="display">힘든 순간,<br>나는 어떻게 버텨낼까?</h1>
    <p>스트레스 상황 8가지에 답하면<br>나만의 대처 방식을 알려줄게요.</p>
    <button class="cta-btn" onclick="startQuiz()">시작하기 →</button>
    <div class="meta-note">약 40초 소요 · 진단이 아닌 자기 이해용 테스트예요</div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen hidden"></div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="result-card" id="resultCard">
      <span class="type-tag">RESULT</span>
      <div class="type-name display" id="rName"></div>
      <div class="type-desc" id="rDesc"></div>
      <div class="tip-box" id="rTip"></div>
      <a class="read-more" href="articles/beyond-mbti.html">나를 이해하는 다른 방법들 →</a>
      <div class="copy-toast" id="copyToast">링크가 복사됐어요!</div>
    </div>
    <div class="action-row">
      <button class="action-btn share" onclick="copyResult()">결과 공유하기</button>
      <button class="action-btn restart" onclick="restartQuiz()">다시하기</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
const questions = [
  { them: "큰 시험이나 프로젝트를 앞두고 스트레스를 받을 때, 나는", options:[
      {text:"계획을 세워서 하나씩 해결해나간다", val:"problem"},
      {text:"일단 내 감정부터 가라앉히려 한다", val:"emotion"},
      {text:"생각하기 싫어서 다른 데로 주의를 돌린다", val:"avoid"},
      {text:"누군가에게 먼저 털어놓는다", val:"social"}
    ]},
  { them: "갈등 상황이 생기면 나는", options:[
      {text:"원인을 파악해서 해결책부터 찾는다", val:"problem"},
      {text:"혼자 감정을 충분히 정리할 시간이 필요하다", val:"emotion"},
      {text:"그 상황 자체를 잠시 피하고 싶어진다", val:"avoid"},
      {text:"믿을 만한 사람에게 조언을 구한다", val:"social"}
    ]},
  { them: "스트레스 받을 때 가장 먼저 드는 생각은?", options:[
      {text:"\"이걸 어떻게 해결하지\"", val:"problem"},
      {text:"\"왜 이렇게 힘들지\"", val:"emotion"},
      {text:"\"생각하기도 싫다\"", val:"avoid"},
      {text:"\"누구한테 말해야 하지\"", val:"social"}
    ]},
  { them: "나에게 스트레스 해소법이란", options:[
      {text:"문제를 실제로 해결하는 것", val:"problem"},
      {text:"울거나 감정을 충분히 표출하는 것", val:"emotion"},
      {text:"잠을 자거나 다른 일에 몰두하는 것", val:"avoid"},
      {text:"누군가와 대화하며 푸는 것", val:"social"}
    ]},
  { them: "예상 못한 안 좋은 일이 생기면", options:[
      {text:"바로 대책부터 세운다", val:"problem"},
      {text:"잠시 충격을 소화할 시간이 필요하다", val:"emotion"},
      {text:"당장은 없었던 일처럼 지내고 싶다", val:"avoid"},
      {text:"누군가와 함께 있고 싶어진다", val:"social"}
    ]},
  { them: "스트레스가 오래 지속되면", options:[
      {text:"더 나은 해결 방법을 계속 찾아본다", val:"problem"},
      {text:"감정 기복이 눈에 띄게 커진다", val:"emotion"},
      {text:"점점 그 문제 자체를 외면하게 된다", val:"avoid"},
      {text:"주변에 더 자주 의지하게 된다", val:"social"}
    ]},
  { them: "친구가 힘들다고 털어놓으면 나는 보통", options:[
      {text:"같이 해결책을 고민해준다", val:"problem"},
      {text:"그 감정에 충분히 공감해준다", val:"emotion"},
      {text:"괜찮아질 거라며 화제를 가볍게 돌린다", val:"avoid"},
      {text:"다른 사람도 불러서 같이 위로해준다", val:"social"}
    ]},
  { them: "마지막 질문. 스트레스가 풀리는 순간은?", options:[
      {text:"문제가 실제로 해결됐을 때", val:"problem"},
      {text:"마음이 정리되고 감정이 가라앉았을 때", val:"emotion"},
      {text:"아예 다른 일에 몰두해서 잊었을 때", val:"avoid"},
      {text:"누군가와 대화하고 난 후", val:"social"}
    ]}
];

const results = {
  problem:{ name:"문제 해결사형", desc:"스트레스를 받으면 일단 원인을 파악하고 해결책부터 찾는 타입이에요. 문제가 실제로 풀려야 마음도 편해지는 편이라, 손 놓고 가만히 있는 걸 제일 못 견뎌해요. 실행력이 큰 강점이지만, 당장 해결되지 않는 상황에서는 오히려 스스로를 더 몰아붙일 수 있어요.", tip:"가끔은 해결하려 하지 않고, 그냥 그 감정을 느끼는 시간도 필요해요." },
  emotion:{ name:"감정 정리사형", desc:"문제를 풀기 전에, 먼저 내 감정이 무엇인지 알아차리고 소화하는 시간이 필요한 타입이에요. 겉으로 급하게 해결하려 하지 않지만, 그만큼 자신의 마음을 깊이 들여다보는 힘이 있어요.", tip:"감정 정리가 너무 길어질 땐, 작은 행동 하나부터 시작해보는 것도 도움이 돼요." },
  avoid:{ name:"잠시 멈춤형", desc:"버거운 상황이 오면 일단 거리를 두고 다른 데 집중하며 숨을 고르는 타입이에요. 이건 도망이 아니라, 스스로를 보호하는 나름의 방식일 수 있어요. 다만 너무 오래 미루면 문제가 더 커질 수 있으니 균형이 필요해요.", tip:"완전히 피하기보다, 짧게라도 문제를 마주하는 시간을 따로 정해보세요." },
  social:{ name:"함께 풀어가는형", desc:"혼자 끙끙 앓기보다, 누군가와 나누면서 스트레스를 푸는 타입이에요. 사람들과의 연결 속에서 힘을 얻는 편이라, 관계 안에서 안정감을 찾아요. 다만 의지할 사람이 곁에 없을 때는 유독 힘들어질 수 있어요.", tip:"의지할 사람이 없을 때를 위해, 나만의 대처법도 하나쯤 만들어두면 좋아요." }
};

let current = 0;
const scores = { problem:0, emotion:0, avoid:0, social:0 };

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  const quizEl = document.getElementById('quiz');

  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = '<div class="bubble them">' + q.them + '</div>';
  quizEl.appendChild(row);

  const answers = document.createElement('div');
  answers.className = 'answers';
  answers.id = 'answers-' + current;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val);
    answers.appendChild(btn);
  });
  quizEl.appendChild(answers);

  quizEl.scrollTop = quizEl.scrollHeight;
  document.getElementById('progressBar').style.width = ((current)/questions.length*100) + '%';
}

function selectAnswer(val){
  scores[val]++;
  document.getElementById('answers-' + current).remove();

  current++;
  document.getElementById('progressBar').style.width = (current/questions.length*100) + '%';

  if(current < questions.length){
    document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
    setTimeout(renderQuestion, 300);
  } else {
    document.getElementById('statusText').textContent = "결과 도착!";
    setTimeout(showResult, 400);
  }
}

function showResult(){
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = results[top];
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rTip').innerHTML = '🌊 <b>이럴 때 도움돼요</b><br>' + r.tip;

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function restartQuiz(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('statusText').textContent = '대화 중...';
}

function copyResult(){
  // 결과 이름 한 줄, 주소 한 줄만 복사한다
  const text = document.getElementById('rName').textContent + '\n' + location.href;
  const toast = document.getElementById('copyToast');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
}
</script>

</body>
</html>
