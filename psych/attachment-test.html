<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나의 애착 유형은? — 썸 탐구생활</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF6F1;
    --paper: #FFFFFF;
    --line: #F0DED8;
    --ink: #3A2E39;
    --ink-soft: #7A6B72;
    --coral: #FF6F59;
    --coral-dark: #E85A45;
    --mustard: #F2B705;
    --teal: #4E9F8B;
    --bubble-me: #FFEDE8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(78,159,139,0.09) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(242,183,5,0.08) 0%, transparent 40%);
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 12px;
  }
  .display{ font-family:'Gaegu', 'Gowun Dodum', sans-serif; }
  .top-nav{
    width:100%; max-width:400px; margin: 0 auto 10px; text-align:left;
    font-family:'Gowun Dodum', sans-serif; font-size: 13px;
  }
  .top-nav a{ color: var(--ink-soft); text-decoration:none; }

  .phone{
    width: 100%;
    max-width: 400px;
    background: var(--paper);
    border-radius: 32px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px -20px rgba(58,46,57,0.25), 0 4px 12px rgba(58,46,57,0.06);
    overflow: hidden;
    position: relative;
    min-height: 640px;
    display:flex;
    flex-direction:column;
  }
  .phone-header{
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--paper);
    position: relative;
    z-index: 2;
  }
  .avatar{
    width: 38px; height:38px; border-radius:50%;
    background: linear-gradient(135deg, var(--teal), var(--mustard));
    display:flex; align-items:center; justify-content:center;
    font-size: 18px;
    flex-shrink:0;
  }
  .header-text .name{ font-weight:700; font-size:15px; }
  .header-text .status{ font-size:11.5px; color: var(--ink-soft); }
  .progress-wrap{ height: 4px; background: var(--line); position: relative; z-index: 2; }
  .progress-bar{ height:100%; width: 0%; background: var(--teal); transition: width 0.4s ease; }

  .screen{ flex:1; display:flex; flex-direction:column; padding: 22px 18px; overflow-y:auto; position:relative; }
  .hidden{ display:none !important; }

  #intro{ align-items:center; justify-content:center; text-align:center; gap:16px; flex:1; }
  #intro .big-emoji{ font-size: 52px; }
  #intro h1{ font-size: 25px; line-height:1.35; }
  #intro p{ font-size: 14px; color: var(--ink-soft); line-height:1.6; padding: 0 6px; }
  .cta-btn{
    margin-top: 10px; background: var(--teal); color: white; border:none;
    padding: 14px 32px; border-radius: 999px; font-family:'Gowun Dodum', sans-serif;
    font-size: 15px; font-weight: 700; cursor:pointer;
    box-shadow: 0 8px 16px -6px rgba(78,159,139,0.5); transition: transform 0.15s ease;
  }
  .cta-btn:active{ transform: scale(0.96); }
  .meta-note{ font-size: 11.5px; color:#B7A9AE; margin-top:4px; }

  .ad-slot{
    margin: 14px 0 0; border: 1px dashed var(--line); border-radius: 12px; padding: 10px;
    text-align:center; font-size: 10.5px; color: #C9BDC2; letter-spacing: 0.03em;
  }

  #quiz{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
  .bubble-row{ display:flex; margin-bottom: 4px; }
  .bubble{ max-width: 82%; padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height:1.5; animation: pop 0.25s ease; }
  @keyframes pop{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:translateY(0);} }
  .bubble.them{ background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.me{ background: var(--teal); color: white; border-bottom-right-radius: 4px; margin-left:auto; }
  .answers{ display:flex; flex-direction:column; gap:8px; margin-top: 4px; }
  .answer-btn{
    align-self: flex-end; max-width: 88%; text-align:left; background: #EAF5F2;
    border: 1px solid #CFEAE3; color: var(--ink); padding: 11px 16px; border-radius: 16px;
    border-bottom-right-radius: 4px; font-family: 'Gowun Dodum', sans-serif; font-size: 13.8px;
    line-height:1.5; cursor:pointer; transition: background 0.15s ease, transform 0.1s ease;
  }
  .answer-btn:hover{ background:#DBEFE9; }
  .answer-btn:active{ transform: scale(0.98); }

  #result{ align-items:center; text-align:center; gap:10px; flex:1; justify-content:center; }
  .result-card{
    width:100%; background: linear-gradient(180deg, #FFFDFB, #FFF6F1); border: 1px solid var(--line);
    border-radius: 22px; padding: 26px 20px 22px; position:relative;
    box-shadow: 0 10px 24px -14px rgba(58,46,57,0.2);
  }
  .type-tag{
    display:inline-block; background: var(--ink); color: white; font-size: 11px;
    letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  .type-name{ font-size: 23px; font-weight:700; line-height:1.3; margin-bottom: 6px; }
  .type-sub{ font-size: 12.5px; color: var(--coral-dark); font-weight:700; letter-spacing:0.02em; margin-bottom: 14px;}
  .type-desc{ font-size: 13.8px; line-height:1.65; color: var(--ink); text-align:left; }
  .match-box{
    margin-top:16px; background: var(--paper); border: 1px dashed var(--line); border-radius: 14px;
    padding: 12px 14px; text-align:left; font-size: 12.8px;
  }
  .match-box b{ color: var(--teal); }
  .voice-line{
    margin-top:10px; text-align:left; font-size:12.5px; color: var(--ink-soft);
    font-style: italic; padding: 10px 12px; background: var(--bg); border-radius:10px;
  }
  .action-row{ display:flex; gap:8px; width:100%; margin-top: 16px; }
  .action-btn{ flex:1; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-family:'Gowun Dodum', sans-serif; font-weight:700; cursor:pointer; border: none; }
  .action-btn.share{ background: var(--ink); color:white; }
  .action-btn.restart{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .copy-toast{
    position:absolute; bottom: -6px; left:50%; transform: translateX(-50%) translateY(100%);
    background: var(--ink); color:white; font-size:12px; padding: 8px 14px; border-radius: 999px;
    opacity:0; transition: opacity 0.25s ease; white-space:nowrap;
  }
  .copy-toast.show{ opacity:1; }
  .read-more{
    margin-top:14px; display:inline-block; font-size:12.5px; color: var(--ink-soft); text-decoration:underline;
  }

  /* 페이지 위치 표시 줄 */
  .crumb-bar{
    width:100%; max-width:400px; margin: 0 auto 12px;
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size: 13px;
  }
  .crumb-bar a{ color:#A87E3F; text-decoration:none; }
  .crumb-bar span{ color:#B4ABA0; }
  .crumb-bar .current{ color:#3A2E39; }

</style>
</head>
<body>

<div style="width:100%; display:flex; justify-content:center;">
<div style="width:100%; max-width:400px;">
<div class="crumb-bar">
  <a href="../index.html">탐구소</a>
  <span>/</span>
  <a href="index.html" class="current">심리</a>
</div>
<div class="phone">
  <div class="phone-header">
    <div class="avatar">🧭</div>
    <div class="header-text">
      <div class="name display">애착유형 연구소</div>
      <div class="status" id="statusText">대화 중...</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- INTRO -->
  <div id="intro" class="screen">
    <div class="big-emoji">🧭</div>
    <h1 class="display">나는 관계에서<br>어떤 애착 유형일까?</h1>
    <p>연애 상황 9가지에 답하면<br>나의 애착 유형과 관계 패턴을 알려줄게요.</p>
    <button class="cta-btn" onclick="startQuiz()">대화 시작하기 →</button>
    <div class="meta-note">약 40초 소요 · 결과는 저장해서 공유할 수 있어요</div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen hidden"></div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="result-card" id="resultCard">
      <span class="type-tag">RESULT</span>
      <div class="type-name display" id="rName"></div>
      <div class="type-sub" id="rSub"></div>
      <div class="type-desc" id="rDesc"></div>
      <div class="match-box" id="rMatch"></div>
      <div class="voice-line" id="rVoice"></div>
      <a class="read-more" href="articles/attachment-style.html">애착 유형에 대해 더 알아보기 →</a>
      <div class="copy-toast" id="copyToast">링크가 복사됐어요!</div>
    </div>
    <div class="action-row">
      <button class="action-btn share" onclick="copyResult()">결과 공유하기</button>
      <button class="action-btn restart" onclick="restartQuiz()">다시하기</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
const questions = [
  { them: "연인과 며칠째 연락이 뜸해요. 나는", type:"attach",
    options: [
      { text: "그럴 수도 있지, 하고 크게 신경 쓰지 않는다", val:"secure" },
      { text: "무슨 일 있나 계속 신경 쓰이고 먼저 연락하게 된다", val:"anxious" },
      { text: "오히려 편하다고 느낀다", val:"avoidant" }
    ]},
  { them: "상대가 갑자기 \"우리 얘기 좀 하자\"고 했어요.", type:"attach",
    options: [
      { text: "무슨 얘기인지 담담하게 물어본다", val:"secure" },
      { text: "심장이 철렁하고 나쁜 상상부터 하게 된다", val:"anxious" },
      { text: "약간 부담스럽고 피하고 싶어진다", val:"avoidant" }
    ]},
  { them: "연인이 나에게 서운한 감정을 표현했어요.", type:"attach",
    options: [
      { text: "왜 그랬는지 차분히 듣고 대화로 풀어간다", val:"secure" },
      { text: "관계가 끝날까 봐 불안해지고 과하게 사과하게 된다", val:"anxious" },
      { text: "일단 그 상황 자체를 피하고 싶어진다", val:"avoidant" }
    ]},
  { them: "연애 초반, 상대가 급속도로 가까워지려고 해요.", type:"attach",
    options: [
      { text: "속도가 맞으면 자연스럽게 따라간다", val:"secure" },
      { text: "그만큼 나도 확신을 얻고 싶어서 반갑다", val:"anxious" },
      { text: "너무 빠르다고 느끼고 한 발 물러서게 된다", val:"avoidant" }
    ]},
  { them: "혼자만의 시간이 필요할 때, 나는", type:"attach",
    options: [
      { text: "솔직하게 말하고 시간을 갖는다", val:"secure" },
      { text: "혼자 있고 싶으면서도 상대가 서운해할까 걱정된다", val:"anxious" },
      { text: "말없이 거리를 두는 게 편하다", val:"avoidant" }
    ]},
  { them: "다툰 뒤 화해하는 방식은?", type:"attach",
    options: [
      { text: "감정이 가라앉으면 먼저 대화를 시도한다", val:"secure" },
      { text: "빨리 풀고 싶어서 조바심이 나고 먼저 연락한다", val:"anxious" },
      { text: "시간이 좀 지나야 다시 마주할 마음이 생긴다", val:"avoidant" }
    ]},
  { them: "상대의 사랑을 확인하고 싶을 때, 나는", type:"attach",
    options: [
      { text: "굳이 확인하지 않아도 크게 불안하지 않다", val:"secure" },
      { text: "말이나 행동으로 자주 확인받고 싶어진다", val:"anxious" },
      { text: "표현을 요구하는 것 자체가 부담스럽다", val:"avoidant" }
    ]},
  { them: "연인이 나에게 크게 의지하려고 해요.", type:"attach",
    options: [
      { text: "자연스럽게 받아들이고 함께 기댄다", val:"secure" },
      { text: "의지받는 게 오히려 관계의 확신처럼 느껴져 좋다", val:"anxious" },
      { text: "숨이 막히고 부담스럽게 느껴진다", val:"avoidant" }
    ]},
  { them: "미래에 대한 이야기(결혼, 동거 등)가 나오면", type:"attach",
    options: [
      { text: "자연스럽게 의견을 나눌 수 있다", val:"secure" },
      { text: "설레면서도 확답을 빨리 듣고 싶어 조급해진다", val:"anxious" },
      { text: "생각만 해도 부담스럽고 화제를 돌리고 싶다", val:"avoidant" }
    ]}
];

const results = {
  secure:{
    name:"흔들림 없는 닻",
    sub:"안정형 (Secure)",
    desc:"관계에서 신뢰를 기본값으로 두는 타입이에요. 연락이 뜸해지거나 갈등이 생겨도 쉽게 불안해하지 않고, 감정을 대화로 풀어가려는 태도를 가지고 있어요. 주변 사람들이 '연애할 때 참 편해 보인다'는 말을 자주 하는 편일 거예요.",
    match:"어떤 유형과도 비교적 잘 맞지만, 특히 <b>불안형</b>에게는 안정감을, <b>회피형</b>에게는 편안한 거리를 줄 수 있어요.",
    voice:"\"연락 안 와도 괜찮아, 바쁜가 보다\" — 이런 생각이 자연스럽게 드는 편이에요."
  },
  anxious:{
    name:"레이더가 늘 켜진 사람",
    sub:"불안형 (Anxious)",
    desc:"상대의 반응 하나하나에 예민하게 반응하고, 관계의 확신을 얻기 위해 연락이나 표현을 자주 확인하고 싶어져요. 좋아하는 마음이 클수록 그만큼 불안도 함께 커지는 편이라, 정작 스스로를 다독이는 게 제일 어려운 숙제일 수 있어요.",
    match:"<b>안정형</b>과 만나면 서서히 안정을 찾아가는 경우가 많고, <b>회피형</b>과는 서로 다른 리듬 때문에 노력이 필요해요.",
    voice:"\"혹시 나한테 화났나?\" — 별일 아닌데도 이런 생각이 먼저 들 때가 많아요."
  },
  avoidant:{
    name:"혼자만의 방이 필요한 사람",
    sub:"회피형 (Avoidant)",
    desc:"가까워지는 것도 좋지만, 나만의 공간과 거리가 있어야 비로소 편안함을 느끼는 타입이에요. 애정 표현이 적은 게 마음이 없어서가 아니라, 그렇게 안정감을 느끼는 방식일 뿐이라는 걸 상대가 알아주면 관계가 한결 편해져요.",
    match:"<b>안정형</b>과 함께라면 편안한 거리를 존중받으며 관계를 이어갈 수 있어요.",
    voice:"\"오늘은 그냥 혼자 있고 싶다\" — 사랑해도 이 마음이 자주 들어요."
  },
  fearful:{
    name:"다가가고 싶은데 무서운 사람",
    sub:"혼란형 (Fearful-Avoidant)",
    desc:"가까워지고 싶은 마음과, 그만큼 상처받을까 두려운 마음이 동시에 있는 타입이에요. 그래서 관계 안에서 마음이 자주 오락가락하고, 스스로도 '내가 왜 이러지' 싶을 때가 있지만 이건 이상한 게 아니라 흔한 반응이에요.",
    match:"무엇보다 <b>안정형</b> 상대와의 꾸준하고 일관된 관계 경험이 큰 도움이 돼요.",
    voice:"\"보고 싶은데 무섭다\" — 이 두 마음이 동시에 드는 게 낯설지 않아요."
  }
};

let current = 0;
const scores = { secure:0, anxious:0, avoidant:0 };

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  const quizEl = document.getElementById('quiz');

  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = '<div class="bubble them">' + q.them + '</div>';
  quizEl.appendChild(row);

  const answers = document.createElement('div');
  answers.className = 'answers';
  answers.id = 'answers-' + current;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val, opt.text);
    answers.appendChild(btn);
  });
  quizEl.appendChild(answers);

  quizEl.scrollTop = quizEl.scrollHeight;
  document.getElementById('progressBar').style.width = ((current)/questions.length*100) + '%';
}

function selectAnswer(val, text){
  scores[val]++;
  document.getElementById('answers-' + current).remove();

  const quizEl = document.getElementById('quiz');
  const meRow = document.createElement('div');
  meRow.className = 'bubble-row';
  meRow.innerHTML = '<div class="bubble me">' + text + '</div>';
  quizEl.appendChild(meRow);
  quizEl.scrollTop = quizEl.scrollHeight;

  current++;
  document.getElementById('progressBar').style.width = (current/questions.length*100) + '%';

  if(current < questions.length){
    document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
    setTimeout(renderQuestion, 350);
  } else {
    document.getElementById('statusText').textContent = "결과 도착!";
    setTimeout(showResult, 500);
  }
}

function showResult(){
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const top = sorted[0];
  const second = sorted[1];
  let key;
  if((top[0]==='anxious' && second[0]==='avoidant') || (top[0]==='avoidant' && second[0]==='anxious')){
    if(Math.abs(top[1]-second[1]) <= 1){
      key = 'fearful';
    } else {
      key = top[0];
    }
  } else {
    key = top[0];
  }

  const r = results[key];
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rSub').textContent = r.sub;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rMatch').innerHTML = '💌 ' + r.match;
  document.getElementById('rVoice').textContent = r.voice;

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function restartQuiz(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('statusText').textContent = '대화 중...';
}

function copyResult(){
  // 결과 이름 한 줄, 주소 한 줄만 복사한다
  const text = document.getElementById('rName').textContent + '\n' + location.href;
  const toast = document.getElementById('copyToast');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
}
</script>
