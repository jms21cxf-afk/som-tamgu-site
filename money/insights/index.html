<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탐구 — 돈 · 탐구소</title>
<meta name="description" content="돈에 대한 행동을 관련 연구와 함께 깊게 살펴보는 글. 투자 정보가 아니라 소비 심리를 다룹니다.">
<link rel="canonical" href="https://tamguso.com/money/insights/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9F1EE; --paper:#FFFFFF; --line:#C6D6CF;
    --ink:#1A2622; --ink-soft:#475650; --ink-faint:#8A9892;
    --accent:#2A7F6E; --accent-soft:#E1F1EC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background: var(--bg); font-family:'Gowun Dodum', sans-serif; color: var(--ink); line-height:1.6; }
  .serif{ font-family:'Do Hyeon', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width: 760px; margin:0 auto; padding: 0 22px; }
  header.site{ padding: 20px 0; border-bottom: 1px solid var(--line); background: var(--paper); }
  header.site .wrap{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:8px; font-size:17px; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background: var(--accent); flex-shrink:0; }
  nav.site a{ font-size:12.5px; color: var(--ink-soft); margin-left:16px; }
  nav.site a.active{ color: var(--ink); font-weight:700; }
  /* 휴대폰에서는 로고 한 줄, 그 아래 메뉴가 한 줄로 보이도록 */
  @media (max-width: 720px){
    header.site{ padding: 16px 0 14px; }
    header.site .wrap{
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .brand{ white-space: nowrap; }
    nav.site{
      display: flex;
      width: 100%;
      justify-content: center;
      gap: 18px;
    }
    nav.site a{
      margin-left: 0;
      font-size: 12px;
      white-space: nowrap;
    }
  }
  .crumb-bar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-family:'Do Hyeon', sans-serif; font-size:13px; margin: 22px 0 8px;
  }
  .crumb-bar a{ color: var(--accent); }
  .crumb-bar span{ color: var(--ink-faint); }
  .crumb-bar .current{ color: #111; }
  .hero{ padding: 18px 0 28px; }
  .hero h1{ font-size: clamp(26px, 5vw, 34px); margin-bottom:10px; line-height:1.35; }
  .hero p{ font-size:14.5px; color: var(--ink-soft); max-width:460px; }
  .card{
    display:block; background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 20px; margin-bottom: 12px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover{ border-color: var(--accent); transform: translateY(-2px); }
  .card .row{ display:flex; align-items:flex-start; gap:14px; }
  .card .emoji{ font-size:26px; }
  .card .title{ font-weight:700; font-size:16px; margin-bottom:4px; }
  .card .desc{ font-size:13px; color: var(--ink-soft); }
  footer.site{ border-top:1px solid var(--line); padding: 26px 0 44px; margin-top:40px; }
  footer.site .copy{ font-size:11px; color: var(--ink-faint); }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand serif" href="../../index.html"><span class="dot"></span>돈 탐구생활</a>
    <nav class="site">
      <a href="../index.html">돈</a>
      <a href="../articles/index.html">읽을거리</a>
      <a href="index.html" class="active">탐구</a>
      <a href="../../about.html">소개</a>
      <a href="../../privacy.html">개인정보처리방침</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="crumb-bar">
    <a href="../../index.html">탐구소</a>
    <span>/</span>
    <a href="../index.html">돈</a>
    <span>/</span>
    <span class="current">탐구</span>
  </div>
  <div class="hero">
    <h1 class="serif">탐구</h1>
    <p>궁금해서 관련 연구를 찾아본 글. 읽을거리보다 조금 깁니다.</p>
  </div>
  <a class="card" href="why-subscriptions-stay.html">
    <div class="row">
      <div class="emoji">🔁</div>
      <div>
        <div class="title">안 쓰는 구독을 못 끊는 이유</div>
        <div class="desc">귀찮아서만은 아닐 수 있다 — 관련 연구 3편과 함께</div>
      </div>
    </div>
  </a>
  <a class="card" href="mood-spending.html">
    <div class="row">
      <div class="emoji">🛍️</div>
      <div>
        <div class="title">기분이 나쁜 날 결제 버튼이 가벼운 이유</div>
        <div class="desc">속상한 날의 소비, 나쁜 습관만은 아닐 수도 — 관련 연구 3편</div>
      </div>
    </div>
  </a>
</main>
<footer class="site">
  <div class="wrap">
    <div class="copy mono">© 2026 TAMGUSO · 재미용 콘텐츠이며 재무·투자 상담을 대체하지 않습니다.</div>
  </div>
</footer>
</body>
</html>
