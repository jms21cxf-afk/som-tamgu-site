<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>돈이 새는 곳 테스트 — 탐구소</title>
<meta name="description" content="구독, 카페, 기분 소비, 모임. 내 돈이 슬금슬금 새는 곳은 어디일까? 8문항 유형 테스트. 재무 상담이 아닙니다.">
<meta name="keywords" content="돈 새는 곳 테스트, 소비 습관 테스트, 지출 유형, 충동구매 테스트, 구독 지출">
<meta property="og:title" content="돈이 새는 곳 테스트 — 탐구소">
<meta property="og:description" content="내 돈은 어디로 슬금슬금 새고 있을까? 40초 소비 습관 테스트">
<meta property="og:url" content="https://tamguso.com/money/leak-test.html">
<link rel="canonical" href="https://tamguso.com/money/leak-test.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9F1EE; --paper:#FFFFFF; --line:#C6D6CF;
    --ink:#1A2622; --ink-soft:#475650; --ink-faint:#8A9892;
    --accent:#2A7F6E; --accent-dark:#206456; --ok:#3D7A6A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(42,127,110,0.08) 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(217,164,0,0.06) 0%, transparent 40%);
    font-family:'Gowun Dodum', sans-serif; color: var(--ink);
    min-height:100vh; padding: 20px 14px 40px;
  }
  .serif{ font-family:'Do Hyeon', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  /* 폰 화면처럼 좁고 길게. 폭을 줄이면 한 줄 글자도 줄어든다 */
  .shell{ width:100%; max-width:336px; margin:0 auto; }
  .crumb-bar{
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size:13px; margin-bottom:14px;
  }
  .crumb-bar a{ color: var(--accent); }
  .crumb-bar span{ color: var(--ink-faint); }
  .crumb-bar .current{ color: var(--ink); }
  .panel{
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 18px; overflow:hidden;
    box-shadow: 0 12px 28px -18px rgba(26,38,34,0.35);
  }
  .panel-head{
    padding: 16px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .panel-head .mark{
    width:36px; height:36px; border-radius:10px;
    background: var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .panel-head .title{ font-weight:700; font-size:14.5px; }
  .panel-head .sub{ font-size:11.5px; color: var(--ink-soft); }
  .progress{ height:3px; background: var(--line); }
  .progress > i{ display:block; height:100%; width:0%; background: var(--accent); transition: width .35s ease; }
  /* 카드 전체를 화면 높이에 가깝게 늘리고, 버튼은 아래로 붙인다 */
  .panel{ min-height: min(760px, calc(100dvh - 70px)); display:flex; flex-direction:column; }
  .screen{ padding: 26px 20px 24px; flex:1; display:flex; flex-direction:column; }
  .cta, .actions{ margin-top:auto; }
  .hidden{ display:none !important; }
  .intro .eyebrow{ font-size:11px; letter-spacing:0.1em; color: var(--accent); margin-bottom:12px; }
  .intro h1{ font-size:28px; line-height:1.35; margin-bottom:12px; }
  .intro p{ font-size:14px; color: var(--ink-soft); margin-bottom:10px; }
  .intro .note{
    font-size:12px; color: var(--ink-faint); margin: 16px 0 22px;
    padding:10px 12px; border-left:3px solid var(--line);
  }
  .cta{
    display:block; width:100%; background: var(--accent); color:#fff;
    border:none; border-radius:12px; padding:14px 16px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .cta:hover{ background: var(--accent-dark); }
  .q-num{ font-size:11.5px; color: var(--accent); letter-spacing:0.06em; margin-bottom:8px; }
  .q-text{ font-size:18px; line-height:1.45; margin-bottom:18px; }
  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    text-align:left; width:100%; background: #F3F8F6; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:14px; font-family:inherit;
    color: var(--ink); cursor:pointer; transition: border-color .15s, background .15s;
  }
  .opt:hover{ border-color: var(--accent); background: #EAF4F0; }
  .result .tag{
    display:inline-block; font-size:11px; letter-spacing:0.08em;
    color: var(--accent); border:1px solid var(--line);
    border-radius:999px; padding:4px 10px; margin-bottom:12px;
  }
  .result .name{ font-size:26px; line-height:1.3; margin-bottom:6px; }
  .result .level{ font-size:13px; color: var(--ink-soft); margin-bottom:14px; }
  .result .desc{ font-size:14px; color: var(--ink-soft); margin-bottom:14px; }
  .result .tip{ background:#F3F8F6; border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
  .result .warn{ font-size:12px; color: var(--ink-faint); margin-bottom:18px; }
  .actions{ display:flex; gap:8px; }
  .actions button{
    flex:1; border-radius:12px; padding:12px;
    font-size:13.5px; font-family:inherit; font-weight:700; cursor:pointer;
  }
  .actions .share{ background: var(--accent); color:#fff; border:none; }
  .actions .again{ background: var(--paper); color: var(--ink); border:1px solid var(--line); }
  .toast{ display:none; text-align:center; font-size:12px; color: var(--ok); margin-top:10px; }
  .toast.show{ display:block; }
</style>
</head>
<body>
<div class="shell">
  <div class="crumb-bar">
    <a href="../index.html">탐구소</a>
    <span>/</span>
    <a href="index.html">돈</a>
    <span>/</span>
    <span class="current">새는 곳</span>
  </div>
  <div class="panel">
    <div class="panel-head">
      <div class="mark">💸</div>
      <div>
        <div class="title">돈이 새는 곳</div>
        <div class="sub" id="statusText">시작 전</div>
      </div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div id="intro" class="screen intro">
      <div class="eyebrow">소비 습관</div>
      <h1 class="serif">내 돈은 어디로<br>슬금슬금 새고 있지?</h1>
      <p>구독, 카페, 기분 따라 지른 날, 모임에서 낸 돈. 큰 한 방보다 어디선가 조금씩 빠지는 쪽이 더 많아요.</p>
      <div class="note">가계부도, 재테크 조언도 아니에요. 돈이 빠지는 버릇이 어느 쪽에 가까운지만 보는 테스트예요. 얼마를 써야 한다는 기준은 없어요.</div>
      <button class="cta" onclick="startQuiz()">해볼래 →</button>
    </div>
    <div id="quiz" class="screen hidden">
      <div class="q-num mono" id="qNum"></div>
      <div class="q-text serif" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div id="result" class="screen result hidden">
      <span class="tag">결과</span>
      <div class="name serif" id="rName"></div>
      <div class="level" id="rLevel"></div>
      <div class="desc" id="rDesc"></div>
      <div class="tip" id="rTip"></div>
      <div class="warn">필요해서 쓴 돈까지 ‘샌 돈’으로 볼 필요는 없어요. 소득과 상황에 따라 달라지고, 재무 상담이 아닙니다.</div>
      <div class="actions">
        <button class="share" onclick="copyResult()">결과 링크 복사</button>
        <button class="again" onclick="restartQuiz()">다시하기</button>
      </div>
      <div class="toast" id="toast">링크가 복사됐어요</div>
    </div>
  </div>
</div>
<script>

// 돈이 새는 곳 — 조용히 새는 / 기분 / 사람 / 할인
const questions = [
  { text: "카드 명세서를 열면 제일 먼저?", options: [
    { text: "‘이거 언제 결제됐지?’ 하고 멈춤", val:"quiet" },
    { text: "‘이날 좀 힘들었구나’ 싶은 날이 보임", val:"mood" },
    { text: "모임·선물 쓴 돈이 먼저 눈에 들어옴", val:"social" },
    { text: "‘그래도 싸게 샀지’ 하고 넘어감", val:"deal" }
  ]},
  { text: "퇴근길에 카페나 편의점을 지나가면?", options: [
    { text: "습관처럼 들어가서 늘 사던 걸 삼", val:"quiet" },
    { text: "‘오늘 고생했으니까’ 하나 삼", val:"mood" },
    { text: "같이 가던 사람이 있으면 따라 들어감", val:"social" },
    { text: "행사 상품이나 쿠폰부터 확인함", val:"deal" }
  ]},
  { text: "구독 서비스, 지금 몇 개 쓰는지 알아?", options: [
    { text: "정확히는 모름. 결제일에 놀람", val:"quiet" },
    { text: "기분 따라 가입했다가 방치한 게 있음", val:"mood" },
    { text: "같이 쓰자는 말에 가입한 게 있음", val:"social" },
    { text: "첫 달 무료·할인에 끌려 가입한 게 있음", val:"deal" }
  ]},
  { text: "모임에서 계산할 때 너는?", options: [
    { text: "얼마 나왔는지 별로 안 따지고 냄", val:"quiet" },
    { text: "그날 기분 좋으면 내가 쏨", val:"mood" },
    { text: "분위기상 내가 더 내는 편", val:"social" },
    { text: "할인·적립되는 카드로 모아서 냄", val:"deal" }
  ]},
  { text: "장바구니에 담아둔 물건은?", options: [
    { text: "담아놓고 잊었다가 문득 결제함", val:"quiet" },
    { text: "스트레스 받는 날 결제함", val:"mood" },
    { text: "남들 다 쓴다는 말에 결제함", val:"social" },
    { text: "세일 알림 오면 바로 결제함", val:"deal" }
  ]},
  { text: "오늘 뭐 샀는지 물어보면?", options: [
    { text: "기억이 잘 안 남", val:"quiet" },
    { text: "그날 기분은 기억나는데 산 건 흐릿함", val:"mood" },
    { text: "누구랑 뭘 했는지는 기억남", val:"social" },
    { text: "얼마나 할인받았는지는 기억남", val:"deal" }
  ]},
  { text: "택배 상자를 뜯을 때 드는 마음은?", options: [
    { text: "‘이거 시켰었나?’ 싶을 때가 있음", val:"quiet" },
    { text: "잠깐 기분 좋고 금방 시들함", val:"mood" },
    { text: "누구 주려고, 같이 쓰려고 산 것도 많음", val:"social" },
    { text: "싸서 쟁여둔 게 집에 쌓여 있음", val:"deal" }
  ]},
  { text: "‘아, 돈 아깝다’ 싶은 순간은?", options: [
    { text: "나도 모르게 빠져나간 걸 발견했을 때", val:"quiet" },
    { text: "기분 풀려고 샀는데 안 풀렸을 때", val:"mood" },
    { text: "내 돈이 아니라 분위기에 쓴 것 같을 때", val:"social" },
    { text: "싸다고 샀는데 안 쓰고 있을 때", val:"deal" }
  ]}
];
const results = {
  quiet:{ name:"조용히 새는 사람", level:"방치형",
    desc: "큰 지출보다 작은 결제가 반복되는 쪽이에요. 구독, 배달, 카페처럼 한 번에는 크지 않은 돈이 자동으로 빠져나가고, 어디에 얼마 나갔는지는 흐릿할 때가 많아요. 씀씀이가 헤퍼서가 아니라, 눈에 안 보여서 새는 경우예요.",
    tip: "구독·자동결제 목록을 한 번 펼쳐보세요. 지난 한 달 동안 안 쓴 것만 해지해도, 쓰던 돈이 아니라 잊고 있던 돈부터 줄일 수 있어요." },
  mood:{ name:"기분이 결제하는 사람", level:"보상형",
    desc: "힘들거나 지친 날 지출이 늘어나는 쪽이에요. 사고 나면 잠깐 풀리지만 그 기분이 오래가지는 않죠. 돈이 새는 게 아니라, 기분을 푸는 방법이 결제에 몰려 있는 거예요.",
    tip: "결제 버튼 앞에서 ‘오늘 무슨 일 있었지?’ 한 번만 떠올려보세요. 하루 지나도 갖고 싶으면 그때 사도 늦지 않아요." },
  social:{ name:"사람 때문에 나가는 사람", level:"관계형",
    desc: "모임, 선물, 경조사, ‘이번엔 내가’처럼 사람과 얽힌 지출이 많은 쪽이에요. 분위기를 깨기 싫어서, 상대가 불편할까 봐 쓰는 돈이라 아깝다고 말하기도 어렵죠. 쓴 돈은 많은데 나를 위해 쓴 건 적을 수 있어요.",
    tip: "‘이번엔 나눠서 하자’ 한 줄을 미리 준비해두세요. 모든 모임에 쓰는 대신, ‘이건 쓰는 모임’을 정해두는 방법도 있어요." },
  deal:{ name:"싸다는 말에 약한 사람", level:"할인형",
    desc: "필요해서 사기보다 싸니까 사는 쪽이에요. 1+1, 쿠폰, 세일 알림에 반응이 빠르고, 산 순간엔 이득을 본 기분이 들죠. 다만 안 쓰고 쌓이면, 싸게 산 물건도 결국 쓴 돈이에요.",
    tip: "살 때 ‘이게 정가였어도 샀을까?’ 물어보세요. 아니라면 싼 게 이유의 전부일 가능성이 커요." }
};

let current = 0;
const scores = Object.fromEntries(Object.keys(results).map(k => [k, 0]));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  renderQuestion();
}
function renderQuestion(){
  const q = questions[current];
  document.getElementById('statusText').textContent = (current + 1) + ' / ' + questions.length;
  document.getElementById('qNum').textContent = (current + 1) + '번째';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  // 선택지 순서를 매번 섞어서, 위치 때문에 결과가 쏠리지 않게 한다
  shuffle(q.options).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val);
    opts.appendChild(btn);
  });
}
function selectAnswer(val){
  scores[val]++;
  current++;
  if (current < questions.length) renderQuestion();
  else {
    document.getElementById('progressBar').style.width = '100%';
    showResult();
  }
}
function showResult(){
  // 동점이면 동점인 유형 중에서 무작위로 고른다
  const max = Math.max(...Object.values(scores));
  const tops = Object.keys(scores).filter(k => scores[k] === max);
  const top = tops[Math.floor(Math.random() * tops.length)];
  const r = results[top];
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('statusText').textContent = '결과';
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rLevel').textContent = r.level;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rTip').textContent = r.tip;
}
function restartQuiz(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('statusText').textContent = '시작 전';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('toast').classList.remove('show');
}
function copyResult(){
  // 결과 이름 한 줄, 주소 한 줄만 복사한다
  const text = document.getElementById('rName').textContent + '\n' + location.href;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }).catch(() => {});
}

</script>
</body>
</html>
