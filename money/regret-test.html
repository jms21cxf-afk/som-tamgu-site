<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지르고 후회하는 패턴 테스트 — 탐구소</title>
<meta name="description" content="결제하자마자, 받아 보고, 더 싼 걸 발견하고, 쓰지 않고 쌓아두고. 나는 어느 순간에 후회할까? 8문항 유형 테스트. 재무 상담이 아닙니다.">
<meta name="keywords" content="지르고 후회 테스트, 소비 후회, 충동구매 후회, 쇼핑 후회 유형, 소비 습관 테스트">
<meta property="og:title" content="지르고 후회하는 패턴 테스트 — 탐구소">
<meta property="og:description" content="나는 어느 순간에 후회할까? 40초 소비 후회 테스트">
<meta property="og:url" content="https://tamguso.com/money/regret-test.html">
<link rel="canonical" href="https://tamguso.com/money/regret-test.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9F1EE; --paper:#FFFFFF; --line:#C6D6CF;
    --ink:#1A2622; --ink-soft:#475650; --ink-faint:#8A9892;
    --accent:#2A7F6E; --accent-dark:#206456; --ok:#3D7A6A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(42,127,110,0.08) 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(217,164,0,0.06) 0%, transparent 40%);
    font-family:'Gowun Dodum', sans-serif; color: var(--ink);
    min-height:100vh; padding: 20px 14px 40px;
  }
  .serif{ font-family:'Do Hyeon', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  /* 폰 화면처럼 좁고 길게. 폭을 줄이면 한 줄 글자도 줄어든다 */
  .shell{ width:100%; max-width:336px; margin:0 auto; }
  .crumb-bar{
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size:13px; margin-bottom:14px;
  }
  .crumb-bar a{ color: var(--accent); }
  .crumb-bar span{ color: var(--ink-faint); }
  .crumb-bar .current{ color: var(--ink); }
  .panel{
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 18px; overflow:hidden;
    box-shadow: 0 12px 28px -18px rgba(26,38,34,0.35);
  }
  .panel-head{
    padding: 16px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .panel-head .mark{
    width:36px; height:36px; border-radius:10px;
    background: var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .panel-head .title{ font-weight:700; font-size:14.5px; }
  .panel-head .sub{ font-size:11.5px; color: var(--ink-soft); }
  .progress{ height:3px; background: var(--line); }
  .progress > i{ display:block; height:100%; width:0%; background: var(--accent); transition: width .35s ease; }
  /* 카드 전체를 화면 높이에 가깝게 늘리고, 버튼은 아래로 붙인다 */
  .panel{ min-height: min(760px, calc(100dvh - 70px)); display:flex; flex-direction:column; }
  .screen{ padding: 26px 20px 24px; flex:1; display:flex; flex-direction:column; }
  .cta, .actions{ margin-top:auto; }
  .hidden{ display:none !important; }
  .intro .eyebrow{ font-size:11px; letter-spacing:0.1em; color: var(--accent); margin-bottom:12px; }
  .intro h1{ font-size:28px; line-height:1.35; margin-bottom:12px; }
  .intro p{ font-size:14px; color: var(--ink-soft); margin-bottom:10px; }
  .intro .note{
    font-size:12px; color: var(--ink-faint); margin: 16px 0 22px;
    padding:10px 12px; border-left:3px solid var(--line);
  }
  .cta{
    display:block; width:100%; background: var(--accent); color:#fff;
    border:none; border-radius:12px; padding:14px 16px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .cta:hover{ background: var(--accent-dark); }
  .q-num{ font-size:11.5px; color: var(--accent); letter-spacing:0.06em; margin-bottom:8px; }
  .q-text{ font-size:18px; line-height:1.45; margin-bottom:18px; }
  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    text-align:left; width:100%; background: #F3F8F6; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:14px; font-family:inherit;
    color: var(--ink); cursor:pointer; transition: border-color .15s, background .15s;
  }
  .opt:hover{ border-color: var(--accent); background: #EAF4F0; }
  .result .tag{
    display:inline-block; font-size:11px; letter-spacing:0.08em;
    color: var(--accent); border:1px solid var(--line);
    border-radius:999px; padding:4px 10px; margin-bottom:12px;
  }
  .result .name{ font-size:26px; line-height:1.3; margin-bottom:6px; }
  .result .level{ font-size:13px; color: var(--ink-soft); margin-bottom:14px; }
  .result .desc{ font-size:14px; color: var(--ink-soft); margin-bottom:14px; }
  .result .tip{ background:#F3F8F6; border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
  .result .warn{ font-size:12px; color: var(--ink-faint); margin-bottom:18px; }
  .actions{ display:flex; gap:8px; }
  .actions button{
    flex:1; border-radius:12px; padding:12px;
    font-size:13.5px; font-family:inherit; font-weight:700; cursor:pointer;
  }
  .actions .share{ background: var(--accent); color:#fff; border:none; }
  .actions .again{ background: var(--paper); color: var(--ink); border:1px solid var(--line); }
  .toast{ display:none; text-align:center; font-size:12px; color: var(--ok); margin-top:10px; }
  .toast.show{ display:block; }
  .result .related{ display:block; font-size:13px; color: var(--accent); margin-bottom:14px; text-decoration:underline; text-underline-offset:3px; }
</style>
</head>
<body>
<div class="shell">
  <div class="crumb-bar">
    <a href="../index.html">탐구소</a>
    <span>/</span>
    <a href="index.html">돈</a>
    <span>/</span>
    <span class="current">후회 패턴</span>
  </div>
  <div class="panel">
    <div class="panel-head">
      <div class="mark">🧾</div>
      <div>
        <div class="title">지르고 후회하는 패턴</div>
        <div class="sub" id="statusText">시작 전</div>
      </div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div id="intro" class="screen intro">
      <div class="eyebrow">소비 후회</div>
      <h1 class="serif">지르고 나서<br>언제 후회하더라?</h1>
      <p>결제하자마자 드는 후회, 받아 보고 드는 후회, 더 싼 걸 발견했을 때의 후회, 쓰지 못해 쌓이는 후회. 후회에도 오는 때가 있어요.</p>
      <div class="note">후회를 없애자는 테스트가 아니에요. 내 후회가 주로 어느 순간에 오는지만 보는 테스트예요. 사지 말라는 말도, 얼마를 써야 한다는 기준도 없어요.</div>
      <button class="cta" onclick="startQuiz()">해볼래 →</button>
    </div>
    <div id="quiz" class="screen hidden">
      <div class="q-num mono" id="qNum"></div>
      <div class="q-text serif" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div id="result" class="screen result hidden">
      <span class="tag">결과</span>
      <div class="name serif" id="rName"></div>
      <div class="level" id="rLevel"></div>
      <div class="desc" id="rDesc"></div>
      <div class="tip" id="rTip"></div>
      <div class="warn">지른 것이 전부 후회로 남는 건 아니에요. 소득과 상황에 따라 달라지고, 재무 상담이 아닙니다.</div>
      <a class="related" id="rRelated" href="insights/index.html">관련 글 →</a>
      <div class="actions">
        <button class="share" onclick="copyResult()">결과 링크 복사</button>
        <button class="again" onclick="restartQuiz()">다시하기</button>
      </div>
      <div class="toast" id="toast">링크가 복사됐어요</div>
    </div>
  </div>
</div>
<script>

// 지르고 후회하는 패턴 — 즉시 / 기대 / 비교 / 보관
const questions = [
  { text: "결제 완료 화면을 본 직후 드는 생각은?", options: [
    { text: "‘어… 내가 왜 샀지?’ 하고 정신이 듦", val:"instant" },
    { text: "‘빨리 왔으면’ 하고 벌써 기대함", val:"expect" },
    { text: "‘다른 데는 얼마지?’ 하고 가격을 다시 찾아봄", val:"compare" },
    { text: "‘언젠가 쓰겠지’ 하고 앱을 닫음", val:"unused" }
  ]},
  { text: "지른 걸 후회하는 순간은 보통 언제야?", options: [
    { text: "결제하고 몇 분~몇 시간 안에", val:"instant" },
    { text: "받아서 써 보고 난 뒤", val:"expect" },
    { text: "더 싼 곳이나 더 좋은 걸 발견했을 때", val:"compare" },
    { text: "몇 주 뒤 안 쓰고 있는 걸 봤을 때", val:"unused" }
  ]},
  { text: "사기 전에 후기를 볼 때 너는?", options: [
    { text: "거의 안 봄. 마음 정해지면 바로 결제함", val:"instant" },
    { text: "좋은 후기만 눈에 잘 들어옴", val:"expect" },
    { text: "가격 비교 사이트도 같이 봄", val:"compare" },
    { text: "후기보다 ‘이거 있으면 쓰겠지’ 하는 마음이 먼저", val:"unused" }
  ]},
  { text: "후회될 때 제일 먼저 하는 행동은?", options: [
    { text: "취소나 환불이 되는지 바로 확인함", val:"instant" },
    { text: "사진이랑 뭐가 다른지 다시 살펴봄", val:"expect" },
    { text: "최저가를 캡처해 두고 차액 보상이 되는지 찾아봄", val:"compare" },
    { text: "서랍이나 구석에 넣어 둠", val:"unused" }
  ]},
  { text: "환불·반품 기한이 7일이라면?", options: [
    { text: "첫날 안에 결정함", val:"instant" },
    { text: "써 보고 정하려다 기한이 지나감", val:"expect" },
    { text: "가격이 내려가면 반품하고 다시 사고 싶음", val:"compare" },
    { text: "마음은 있었는데 귀찮아서 지나감", val:"unused" }
  ]},
  { text: "집에 있는 ‘후회 물건’을 떠올려 보면?", options: [
    { text: "기분 따라 급하게 산 것", val:"instant" },
    { text: "사진과 달라서 실망한 것", val:"expect" },
    { text: "사고 나서 더 싸게 팔더라 싶은 것", val:"compare" },
    { text: "포장도 안 뜯은 것", val:"unused" }
  ]},
  { text: "비슷한 후회를 반복하는 이유를 꼽는다면?", options: [
    { text: "그 순간에는 멈추기 어려워서", val:"instant" },
    { text: "이번에는 다를 것 같아서", val:"expect" },
    { text: "비교를 끝까지 하지 않고 사서", val:"compare" },
    { text: "사 놓으면 쓰게 될 줄 알아서", val:"unused" }
  ]},
  { text: "후회를 줄이려면 뭐가 제일 필요할까?", options: [
    { text: "결제 전에 잠깐 멈추는 시간", val:"instant" },
    { text: "실물이나 사용 후기를 먼저 확인하는 것", val:"expect" },
    { text: "사기 전에 비교 기준을 정해 두는 것", val:"compare" },
    { text: "언제 쓸지 미리 정해 보는 것", val:"unused" }
  ]}
];
const results = {
  instant:{ name:"결제 직후 정신이 드는 사람", level:"즉시후회형",
    desc: "버튼을 누르고 나서야 ‘내가 왜 샀지?’ 하고 정신이 드는 쪽이에요. 사는 순간에는 기분이나 분위기가 앞서고, 계산은 그 뒤에 따라와요. 후회가 빨리 오는 만큼 취소할 시간도 남아 있는 편이에요.",
    tip: "결제 버튼을 누르기 전에 ‘지금 기분이 어때?’ 한 단어만 떠올려 보세요. 담아 두고 하루 지난 뒤에도 갖고 싶으면 그때 사도 늦지 않아요.",
    rel:{ href:"insights/mood-spending.html", title:"기분이 나쁜 날 결제 버튼이 가벼운 이유" } },
  expect:{ name:"기대가 먼저 도착하는 사람", level:"기대과잉형",
    desc: "물건이 오기도 전에 머릿속에서 이미 쓰고 있는 쪽이에요. 사진과 좋은 후기가 기대를 키우고, 막상 받으면 ‘생각보다…’ 하는 차이가 후회로 이어져요. 물건이 나빠서라기보다 기대가 앞서 달려간 경우가 많아요.",
    tip: "사기 전에 ‘이게 별로일 수 있는 점’을 후기에서 하나 찾아보세요. 좋은 말만 모으던 눈을 한 번 돌려놓는 방법이에요.",
    rel:{ href:"insights/index.html", title:"돈 탭의 탐구 글 더 보기" } },
  compare:{ name:"더 싼 곳이 눈에 밟히는 사람", level:"비교형",
    desc: "산 물건 자체보다 ‘다른 선택지’가 마음에 남는 쪽이에요. 결제하고 나서 가격을 다시 찾아보고, 더 싼 곳이나 더 좋은 걸 발견하면 산 걸 후회해요. 물건은 멀쩡한데 비교 때문에 만족이 줄어드는 거예요.",
    tip: "사기 전에 ‘이 가격이면 산다’는 선을 하나 정해 두세요. 그 선 안에서 샀다면, 나중에 더 싼 걸 봐도 그건 다른 선택이었다고 접어둘 수 있어요.",
    rel:{ href:"insights/why-discounts-feel-good.html", title:"할인이라서 샀는데, 왜 이렇게 기분이 좋을까" } },
  unused:{ name:"쓸 날을 기다리는 사람", level:"보관형",
    desc: "사는 순간에는 ‘쓰겠지’ 하고, 막상 쓰는 날은 오지 않아 쌓이는 쪽이에요. 후회는 천천히, 한참 뒤에 와요. 포장도 안 뜯은 물건을 볼 때마다 조금씩 마음이 무거워지죠.",
    tip: "사기 전에 ‘언제 쓸까?’ 날짜를 하나만 떠올려 보세요. 바로 떠오르지 않는다면, 오늘 사는 건 물건이 아니라 ‘쓰는 나’일 수 있어요.",
    rel:{ href:"insights/why-subscriptions-stay.html", title:"안 쓰는 구독을 못 끊는 이유" } }
};

let current = 0;
const scores = Object.fromEntries(Object.keys(results).map(k => [k, 0]));

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  renderQuestion();
}
function renderQuestion(){
  const q = questions[current];
  document.getElementById('statusText').textContent = (current + 1) + ' / ' + questions.length;
  document.getElementById('qNum').textContent = (current + 1) + '번째';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  // 선택지 순서를 매번 섞어서, 위치 때문에 결과가 쏠리지 않게 한다
  shuffle(q.options).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val);
    opts.appendChild(btn);
  });
}
function selectAnswer(val){
  scores[val]++;
  current++;
  if (current < questions.length) renderQuestion();
  else {
    document.getElementById('progressBar').style.width = '100%';
    showResult();
  }
}
function showResult(){
  // 동점이면 동점인 유형 중에서 무작위로 고른다
  const max = Math.max(...Object.values(scores));
  const tops = Object.keys(scores).filter(k => scores[k] === max);
  const top = tops[Math.floor(Math.random() * tops.length)];
  const r = results[top];
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('statusText').textContent = '결과';
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rLevel').textContent = r.level;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rTip').textContent = r.tip;
  const rel = document.getElementById('rRelated');
  rel.href = r.rel.href;
  rel.textContent = (r.rel.href.endsWith('insights/index.html') ? '' : '관련 글 · ') + r.rel.title + ' →';
}
function restartQuiz(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('statusText').textContent = '시작 전';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('toast').classList.remove('show');
}
function copyResult(){
  // 결과 이름 한 줄, 주소 한 줄만 복사한다
  const text = document.getElementById('rName').textContent + '\n' + location.href;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }).catch(() => {});
}

</script>
</body>
</html>
