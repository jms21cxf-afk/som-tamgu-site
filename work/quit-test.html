<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이직 고민 테스트 — 탐구소</title>
<meta name="description" content="채용공고만 보는지, 마음속으론 이미 나갔는지. 8문항으로 온도 체크.">
<meta name="keywords" content="이직 고민 테스트, 퇴사 테스트, 이직 타이밍, 직장인 이직">
<meta property="og:title" content="이직 고민 테스트 — 탐구소">
<meta property="og:description" content="채용공고는 북마크만, 사직서는 메모장에만? 이직 온도 체크">
<meta property="og:url" content="https://tamguso.com/work/quit-test.html">
<link rel="canonical" href="https://tamguso.com/work/quit-test.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E8EEF2; --paper:#FFFFFF; --line:#C5D0D8;
    --ink:#1A2228; --ink-soft:#4A5863; --ink-faint:#8A97A1;
    --accent:#2F6F8F; --accent-dark:#245A74; --ok:#3D7A6A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 0%, rgba(47,111,143,0.08) 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(61,122,106,0.07) 0%, transparent 40%);
    font-family:'Gowun Dodum', sans-serif; color: var(--ink);
    min-height:100vh; padding: 20px 14px 40px;
  }
  .serif{ font-family:'Do Hyeon', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  /* 폰 화면처럼 좁고 길게. 폭을 줄이면 한 줄 글자도 줄어든다 */
  .shell{ width:100%; max-width:336px; margin:0 auto; }
  .crumb-bar{
    display:flex; align-items:center; gap:6px;
    font-family:'Do Hyeon', sans-serif; font-size:13px; margin-bottom:14px;
  }
  .crumb-bar a{ color: var(--accent); }
  .crumb-bar span{ color: var(--ink-faint); }
  .crumb-bar .current{ color: var(--ink); }
  .panel{
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 18px; overflow:hidden;
    box-shadow: 0 12px 28px -18px rgba(26,34,40,0.35);
  }
  .panel-head{
    padding: 16px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .panel-head .mark{
    width:36px; height:36px; border-radius:10px;
    background: var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .panel-head .title{ font-weight:700; font-size:14.5px; }
  .panel-head .sub{ font-size:11.5px; color: var(--ink-soft); }
  .progress{ height:3px; background: var(--line); }
  .progress > i{ display:block; height:100%; width:0%; background: var(--accent); transition: width .35s ease; }
  /* 카드 전체를 화면 높이에 가깝게 늘리고, 버튼은 아래로 붙인다 */
  .panel{ min-height: min(760px, calc(100dvh - 70px)); display:flex; flex-direction:column; }
  .screen{ padding: 26px 20px 24px; flex:1; display:flex; flex-direction:column; }
  .cta, .actions{ margin-top:auto; }
  .hidden{ display:none !important; }
  .intro .eyebrow{ font-size:11px; letter-spacing:0.1em; color: var(--accent); margin-bottom:12px; }
  .intro h1{ font-size:28px; line-height:1.35; margin-bottom:12px; }
  .intro p{ font-size:14px; color: var(--ink-soft); margin-bottom:10px; }
  .intro .note{
    font-size:12px; color: var(--ink-faint); margin: 16px 0 22px;
    padding:10px 12px; border-left:3px solid var(--line);
  }
  .cta{
    display:block; width:100%; background: var(--accent); color:#fff;
    border:none; border-radius:12px; padding:14px 16px;
    font-size:15px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .cta:hover{ background: var(--accent-dark); }
  .q-num{ font-size:11.5px; color: var(--accent); letter-spacing:0.06em; margin-bottom:8px; }
  .q-text{ font-size:18px; line-height:1.45; margin-bottom:18px; }
  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{
    text-align:left; width:100%; background: #F4F7F9; border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font-size:14px; font-family:inherit;
    color: var(--ink); cursor:pointer; transition: border-color .15s, background .15s;
  }
  .opt:hover{ border-color: var(--accent); background: #EEF5F9; }
  .result .tag{
    display:inline-block; font-size:11px; letter-spacing:0.08em;
    color: var(--accent); border:1px solid var(--line);
    border-radius:999px; padding:4px 10px; margin-bottom:12px;
  }
  .result .name{ font-size:26px; line-height:1.3; margin-bottom:6px; }
  .result .level{ font-size:13px; color: var(--ink-soft); margin-bottom:14px; }
  .result .desc{ font-size:14px; color: var(--ink-soft); margin-bottom:14px; }
  .result .tip{ background:#F4F7F9; border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:12px; }
  .result .warn{ font-size:12px; color: var(--ink-faint); margin-bottom:18px; }
  .actions{ display:flex; gap:8px; }
  .actions button{
    flex:1; border-radius:12px; padding:12px;
    font-size:13.5px; font-family:inherit; font-weight:700; cursor:pointer;
  }
  .actions .share{ background: var(--accent); color:#fff; border:none; }
  .actions .again{ background: var(--paper); color: var(--ink); border:1px solid var(--line); }
  .toast{ display:none; text-align:center; font-size:12px; color: var(--ok); margin-top:10px; }
  .toast.show{ display:block; }
</style>
</head>
<body>
<div class="shell">
  <div class="crumb-bar">
    <a href="../index.html">탐구소</a>
    <span>/</span>
    <a href="index.html">직장</a>
    <span>/</span>
    <span class="current">이직</span>
  </div>
  <div class="panel">
    <div class="panel-head">
      <div class="mark">🚪</div>
      <div>
        <div class="title">이직 온도</div>
        <div class="sub" id="statusText">시작 전</div>
      </div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div id="intro" class="screen intro">
      <div class="eyebrow">직장인 한정</div>
      <h1 class="serif">아직은 여기야,<br>아니면 슬슬?</h1>
      <p>채용공고는 북마크만 해두고, 사직서는 메모장에만 있는 그 상태. ‘힘들어서’와 ‘여길 떠나고 싶어서’는 다를 때가 많아요.</p>
      <div class="note">이직 상담이 아니에요. 지금 마음이 어느 쪽에 가까운지만 보는 테스트예요. 나가라는 조언이 아닙니다.</div>
      <button class="cta" onclick="startQuiz()">해볼래 →</button>
    </div>
    <div id="quiz" class="screen hidden">
      <div class="q-num mono" id="qNum"></div>
      <div class="q-text serif" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div id="result" class="screen result hidden">
      <span class="tag">결과</span>
      <div class="name serif" id="rName"></div>
      <div class="level" id="rLevel"></div>
      <div class="desc" id="rDesc"></div>
      <div class="tip" id="rTip"></div>
      <div class="warn">번아웃이랑 이직 욕구는 겹쳐 보여도 처방이 달라요. 몸이 먼저 무너진 거면, 이직보다 휴식이 먼저일 수 있어요.</div>
      <div class="actions">
        <button class="share" onclick="copyResult()">결과 링크 복사</button>
        <button class="again" onclick="restartQuiz()">다시하기</button>
      </div>
      <div class="toast" id="toast">링크가 복사됐어요</div>
    </div>
  </div>
</div>
<script>

// 점수가 높을수록 이직 마음이 큰 쪽 (0~3)
const questions = [
  {
    "text": "회사 건물 앞에서 드는 생각은?",
    "options": [
      {
        "text": "‘오늘도 가자’ 정도",
        "score": 0
      },
      {
        "text": "‘이번 주만 넘기자’",
        "score": 1
      },
      {
        "text": "‘여길 언제까지 다니지’",
        "score": 2
      },
      {
        "text": "이미 ‘다음’을 떠올리고 있음",
        "score": 3
      }
    ]
  },
  {
    "text": "채용공고는?",
    "options": [
      {
        "text": "거의 안 봄",
        "score": 0
      },
      {
        "text": "심심할 때 슬쩍",
        "score": 1
      },
      {
        "text": "관심 회사는 저장해둠",
        "score": 2
      },
      {
        "text": "이력서 맞춰가며 봄",
        "score": 3
      }
    ]
  },
  {
    "text": "회사 욕할 때 진심은?",
    "options": [
      {
        "text": "푸념이고 내일 출근함",
        "score": 0
      },
      {
        "text": "반은 농담, 반은 진담",
        "score": 1
      },
      {
        "text": "말하다 보면 진짜 화가 남",
        "score": 2
      },
      {
        "text": "이미 마음속에선 남이 됨",
        "score": 3
      }
    ]
  },
  {
    "text": "여기서 더 배울 게?",
    "options": [
      {
        "text": "아직 있음. 남는 이유임",
        "score": 0
      },
      {
        "text": "조금은 남았는데 느려짐",
        "score": 1
      },
      {
        "text": "반복만 하는 느낌",
        "score": 2
      },
      {
        "text": "여긴 더 이상 내 자리가 아님",
        "score": 3
      }
    ]
  },
  {
    "text": "팀 사람들 생각하면?",
    "options": [
      {
        "text": "그래서 남는 편",
        "score": 0
      },
      {
        "text": "아쉽긴 한데 일이 먼저",
        "score": 1
      },
      {
        "text": "사람 때문에 못 나가는 중",
        "score": 2
      },
      {
        "text": "사람까지 지쳐서 상관없어짐",
        "score": 3
      }
    ]
  },
  {
    "text": "이력서·포트폴리오는?",
    "options": [
      {
        "text": "손 안 댄 지 오래됨",
        "score": 0
      },
      {
        "text": "생각만 하고 있음",
        "score": 1
      },
      {
        "text": "몰래 손보고 있음",
        "score": 2
      },
      {
        "text": "이미 돌려본 적 있음",
        "score": 3
      }
    ]
  },
  {
    "text": "연봉·조건이 조금 나아지면?",
    "options": [
      {
        "text": "그럼 더 다닐 마음임",
        "score": 0
      },
      {
        "text": "조금은 버틸 듯",
        "score": 1
      },
      {
        "text": "돈 문제가 아님. 별로 안 움직임",
        "score": 2
      },
      {
        "text": "조건이 아니라 환경이 안 맞음",
        "score": 3
      }
    ]
  },
  {
    "text": "지금 한 문장으로?",
    "options": [
      {
        "text": "아직은 여기가 맞음",
        "score": 0
      },
      {
        "text": "고민은 하는데 실행은 아님",
        "score": 1
      },
      {
        "text": "한쪽 발은 문 밖에 있음",
        "score": 2
      },
      {
        "text": "마음속으론 이미 나감",
        "score": 3
      }
    ]
  }
];

const bands = [
  {
    "max": 6,
    "name": "아직은 여기인 사람",
    "level": "온도 낮음",
    "desc": "푸념은 해도 내일 출근하는 타입이에요. 채용공고를 안 보는 게 게으름이 아니라, 아직 ‘여기’에 에너지가 남아 있는 쪽에 가깝습니다. 사람이나 배울 점이 남는 이유로 작동하고 있어요.",
    "tip": "지금이 제일 고치기 쉬운 타이밍이에요. 싫은 점 하나를 팀에 말해두면, 나중에 ‘갑자기 나감’이 덜해요."
  },
  {
    "max": 12,
    "name": "슬슬 온도 오르는 사람",
    "level": "탐색 구간",
    "desc": "심심할 때 공고를 보고, ‘이번 주만’이 입버릇인 구간이에요. 아직 사직서는 아니지만, 머릿속에선 이미 비교를 시작했습니다. 돈으로 달래지면 버티고, 안 달래지면 다음 단계로 가요.",
    "tip": "공고만 보지 말고 ‘내가 다음에서 원하는 것 3개’만 적어보세요. 막연한 탈출이 구체적인 이동으로 바뀝니다."
  },
  {
    "max": 18,
    "name": "한쪽 발은 문 밖에 있는 사람",
    "level": "준비 구간",
    "desc": "이력서를 몰래 손보고, 배울 게 반복처럼 느껴지고, 회사 욕이 진담이 되는 쪽이에요. 사람 때문에 못 나가는 중일 수도 있어요. 나가지는 않았는데, 마음은 이미 반쯤 짐 싼 상태입니다.",
    "tip": "나가기 전에 ‘여기 남는 이유’를 한 줄로 적어보세요. 안 써지면, 그건 이미 답이 나온 거에 가깝습니다."
  },
  {
    "max": 99,
    "name": "마음속으론 이미 나간 사람",
    "level": "이직 온도 높음",
    "desc": "출근길부터 ‘다음’이 떠오르고, 공고를 이력서에 맞춰 보고, 사람까지 지쳐서 상관없어진 패턴이에요. 조건이 나아져도 잘 안 움직입니다. 몸이 아직 회사 책상에 있을 뿐이에요.",
    "tip": "충동으로 사표부터 내지 마세요. 다음 한 곳의 조건·하는 일만 구체적으로 보고, 그다음에 움직여도 늦지 않아요."
  }
];

let current = 0;
let total = 0;

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current = 0;
  total = 0;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  document.getElementById('statusText').textContent = (current + 1) + ' / ' + questions.length;
  document.getElementById('qNum').textContent = (current + 1) + '번째';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = (current / questions.length * 100) + '%';
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.text;
    // 선택 시 점수만 누적하고 다음 문항으로
    btn.onclick = () => selectAnswer(opt.score);
    opts.appendChild(btn);
  });
}

function selectAnswer(score){
  total += score;
  current++;
  if (current < questions.length) renderQuestion();
  else {
    document.getElementById('progressBar').style.width = '100%';
    showResult();
  }
}

function showResult(){
  const band = bands.find(b => total <= b.max);
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('statusText').textContent = '결과';
  document.getElementById('rName').textContent = band.name;
  document.getElementById('rLevel').textContent = band.level + ' · 점수 ' + total;
  document.getElementById('rDesc').textContent = band.desc;
  document.getElementById('rTip').textContent = band.tip;
}

function restartQuiz(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('statusText').textContent = '시작 전';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('toast').classList.remove('show');
}

function copyResult(){
  navigator.clipboard.writeText(location.href).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  });
}

</script>
</body>
</html>
