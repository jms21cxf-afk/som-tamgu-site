<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나의 사랑의 언어는? — 썸 탐구생활</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF6F1; --paper: #FFFFFF; --line: #F0DED8;
    --ink: #3A2E39; --ink-soft: #7A6B72;
    --coral: #FF6F59; --coral-dark: #E85A45;
    --mustard: #F2B705; --mustard-dark:#D9A400;
    --teal: #4E9F8B; --bubble-me: #FFF6DE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(242,183,5,0.10) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,111,89,0.08) 0%, transparent 40%);
    font-family: 'Gowun Dodum', sans-serif; color: var(--ink);
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px 12px;
  }
  .display{ font-family:'Gaegu', 'Gowun Dodum', sans-serif; }
  .top-nav{ width:100%; max-width:400px; margin: 0 auto 10px; text-align:left; font-size: 13px; }
  .top-nav a{ color: var(--ink-soft); text-decoration:none; }

  .phone{
    width: 100%; max-width: 400px; background: var(--paper); border-radius: 32px;
    border: 1px solid var(--line); box-shadow: 0 20px 50px -20px rgba(58,46,57,0.25), 0 4px 12px rgba(58,46,57,0.06);
    overflow: hidden; position: relative; min-height: 640px; display:flex; flex-direction:column;
  }
  .phone-header{ padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display:flex; align-items:center; gap: 10px; background: var(--paper); position: relative; z-index: 2; }
  .avatar{ width: 38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--mustard), var(--coral)); display:flex; align-items:center; justify-content:center; font-size: 18px; flex-shrink:0; }
  .header-text .name{ font-weight:700; font-size:15px; }
  .header-text .status{ font-size:11.5px; color: var(--ink-soft); }
  .progress-wrap{ height: 4px; background: var(--line); position: relative; z-index: 2; }
  .progress-bar{ height:100%; width: 0%; background: var(--mustard-dark); transition: width 0.4s ease; }

  .screen{ flex:1; display:flex; flex-direction:column; padding: 22px 18px; overflow-y:auto; position:relative; }
  .hidden{ display:none !important; }

  #intro{ align-items:center; justify-content:center; text-align:center; gap:16px; flex:1; }
  #intro .big-emoji{ font-size: 52px; }
  #intro h1{ font-size: 25px; line-height:1.35; }
  #intro p{ font-size: 14px; color: var(--ink-soft); line-height:1.6; padding: 0 6px; }
  .cta-btn{
    margin-top: 10px; background: var(--mustard-dark); color: white; border:none; padding: 14px 32px;
    border-radius: 999px; font-family:'Gowun Dodum', sans-serif; font-size: 15px; font-weight: 700;
    cursor:pointer; box-shadow: 0 8px 16px -6px rgba(217,164,0,0.45); transition: transform 0.15s ease;
  }
  .cta-btn:active{ transform: scale(0.96); }
  .meta-note{ font-size: 11.5px; color:#B7A9AE; margin-top:4px; }

  .ad-slot{ margin: 14px 0 0; border: 1px dashed var(--line); border-radius: 12px; padding: 10px; text-align:center; font-size: 10.5px; color: #C9BDC2; letter-spacing: 0.03em; }

  #quiz{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; }
  .bubble-row{ display:flex; margin-bottom: 4px; }
  .bubble{ max-width: 82%; padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height:1.5; animation: pop 0.25s ease; }
  @keyframes pop{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:translateY(0);} }
  .bubble.them{ background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.me{ background: var(--mustard-dark); color: white; border-bottom-right-radius: 4px; margin-left:auto; }
  .answers{ display:flex; flex-direction:column; gap:8px; margin-top: 4px; }
  .answer-btn{
    align-self: flex-end; max-width: 88%; text-align:left; background: var(--bubble-me);
    border: 1px solid #F5E4A8; color: var(--ink); padding: 11px 16px; border-radius: 16px;
    border-bottom-right-radius: 4px; font-family: 'Gowun Dodum', sans-serif; font-size: 13.8px;
    line-height:1.5; cursor:pointer; transition: background 0.15s ease, transform 0.1s ease;
  }
  .answer-btn:hover{ background:#FCEFC0; }
  .answer-btn:active{ transform: scale(0.98); }

  #result{ align-items:center; text-align:center; gap:10px; flex:1; justify-content:center; }
  .result-card{
    width:100%; background: linear-gradient(180deg, #FFFDFB, #FFF6F1); border: 1px solid var(--line);
    border-radius: 22px; padding: 26px 20px 22px; position:relative; box-shadow: 0 10px 24px -14px rgba(58,46,57,0.2);
  }
  .type-tag{ display:inline-block; background: var(--ink); color: white; font-size: 11px; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
  .type-name{ font-size: 23px; font-weight:700; line-height:1.3; margin-bottom: 6px; }
  .type-sub{ font-size: 12.5px; color: var(--coral-dark); font-weight:700; letter-spacing:0.02em; margin-bottom: 14px;}
  .type-desc{ font-size: 13.8px; line-height:1.65; color: var(--ink); text-align:left; }
  .match-box{ margin-top:16px; background: var(--paper); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; text-align:left; font-size: 12.8px; }
  .match-box b{ color: var(--mustard-dark); }
  .empty-line{
    margin-top:10px; text-align:left; font-size:12px; color: var(--coral-dark);
    background: #FFF1EC; border-radius:10px; padding:10px 12px;
  }
  .read-more{
    margin-top:14px; display:inline-block; font-size:12.5px; color: var(--ink-soft); text-decoration:underline;
  }
  .action-row{ display:flex; gap:8px; width:100%; margin-top: 16px; }
  .action-btn{ flex:1; border-radius: 14px; padding: 12px 8px; font-size: 13px; font-family:'Gowun Dodum', sans-serif; font-weight:700; cursor:pointer; border: none; }
  .action-btn.share{ background: var(--ink); color:white; }
  .action-btn.restart{ background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .copy-toast{ position:absolute; bottom: -6px; left:50%; transform: translateX(-50%) translateY(100%); background: var(--ink); color:white; font-size:12px; padding: 8px 14px; border-radius: 999px; opacity:0; transition: opacity 0.25s ease; white-space:nowrap; }
  .copy-toast.show{ opacity:1; }
</style>
</head>
<body>

<div style="width:100%; display:flex; justify-content:center;">
<div style="width:100%; max-width:400px;">
<div class="top-nav"><a href="index.html">← 썸 탐구생활 홈</a></div>
<div class="phone">
  <div class="phone-header">
    <div class="avatar">💛</div>
    <div class="header-text">
      <div class="name display">사랑의 언어 사전</div>
      <div class="status" id="statusText">대화 중...</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- INTRO -->
  <div id="intro" class="screen">
    <div class="big-emoji">💛</div>
    <h1 class="display">나는 어떤 방식으로<br>사랑을 느낄까?</h1>
    <p>둘 중 더 끌리는 걸 10번 골라보면<br>나의 사랑의 언어를 알려줄게요.</p>
    <button class="cta-btn" onclick="startQuiz()">대화 시작하기 →</button>
    <div class="meta-note">약 40초 소요 · 결과는 저장해서 공유할 수 있어요</div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="screen hidden"></div>

  <!-- RESULT -->
  <div id="result" class="screen hidden">
    <div class="result-card" id="resultCard">
      <span class="type-tag">RESULT</span>
      <div class="type-name display" id="rName"></div>
      <div class="type-sub" id="rSub"></div>
      <div class="type-desc" id="rDesc"></div>
      <div class="match-box" id="rMatch"></div>
      <div class="empty-line" id="rEmpty"></div>
      <a class="read-more" href="articles/beyond-mbti.html">연애할 때 유형보다 중요한 것들 →</a>
      <div class="copy-toast" id="copyToast">링크가 복사됐어요!</div>
    </div>
    <div class="action-row">
      <button class="action-btn share" onclick="copyResult()">결과 공유하기</button>
      <button class="action-btn restart" onclick="restartQuiz()">다시하기</button>
    </div>
  </div>
</div>
</div>
</div>

<script>
const questions = [
  { them: "연인에게 이런 걸 받으면 더 마음이 채워질 것 같아요.", options: [
      { text: "\"오늘도 고생했어, 잘하고 있어\" 라는 말 한마디", val:"words" },
      { text: "바쁘더라도 온전히 나에게 집중해주는 시간", val:"time" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "다정한 말 한마디", val:"words" },
      { text: "말없이 알아서 챙겨주는 행동", val:"acts" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "다정한 말 한마디", val:"words" },
      { text: "작지만 의미 있는 선물", val:"gifts" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "다정한 말 한마디", val:"words" },
      { text: "손을 잡거나 안아주는 스킨십", val:"touch" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "오롯이 집중해주는 시간", val:"time" },
      { text: "말없이 알아서 챙겨주는 행동", val:"acts" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "오롯이 집중해주는 시간", val:"time" },
      { text: "작지만 의미 있는 선물", val:"gifts" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "오롯이 집중해주는 시간", val:"time" },
      { text: "손을 잡거나 안아주는 스킨십", val:"touch" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "말없이 알아서 챙겨주는 행동", val:"acts" },
      { text: "작지만 의미 있는 선물", val:"gifts" }
    ]},
  { them: "둘 중 더 끌리는 건?", options: [
      { text: "말없이 알아서 챙겨주는 행동", val:"acts" },
      { text: "손을 잡거나 안아주는 스킨십", val:"touch" }
    ]},
  { them: "마지막 질문이에요. 둘 중 더 끌리는 건?", options: [
      { text: "작지만 의미 있는 선물", val:"gifts" },
      { text: "손을 잡거나 안아주는 스킨십", val:"touch" }
    ]}
];

const results = {
  words:{ name:"말 한마디로 채워지는 사람", sub:"인정하는 말 (Words of Affirmation)",
    desc:"\"고생했어\", \"잘하고 있어\" 같은 말 한마디에 마음이 꽉 차는 타입이에요. 반대로 무심한 말투나 칭찬 없는 관계에서는 쉽게 서운함을 느껴요. 연인에게 표현을 자주 요청해도 괜찮아요 — 그게 당신에게는 사랑을 확인하는 가장 확실한 방법이니까요.",
    match:"연인에게 \"그냥 말로 해줘도 충분해\"라고 솔직하게 알려주는 게 서로에게 좋아요.",
    empty:"이 언어가 채워지지 않으면: 아무리 잘해줘도 사랑받는다는 확신이 안 서고, 자꾸 확인하고 싶어져요." },
  time:{ name:"함께 있는 시간이 사랑인 사람", sub:"함께하는 시간 (Quality Time)",
    desc:"무엇을 하느냐보다, 온전히 집중해서 함께 있는 시간 자체가 사랑으로 느껴지는 타입이에요. 휴대폰을 보면서 옆에 있는 것보다, 짧아도 눈을 맞추고 대화하는 시간이 훨씬 소중해요. 바쁜 연인이라면 '짧고 온전한 시간'을 요청해보는 게 도움이 돼요.",
    match:"물리적으로 함께하는 시간을 꾸준히 만드는 연인과 특히 잘 맞아요.",
    empty:"이 언어가 채워지지 않으면: 같은 공간에 있어도 마음은 딴 데 가 있는 것 같아 외로워져요." },
  acts:{ name:"행동으로 증명해야 믿는 사람", sub:"봉사 (Acts of Service)",
    desc:"말보다 행동이 더 크게 와닿는 타입이에요. 힘들 때 옆에서 챙겨주거나, 말하지 않아도 알아서 도와주는 작은 행동들에서 사랑을 느껴요. 이 유형은 상대의 사소한 배려를 알아채는 눈이 밝다는 장점이 있어요.",
    match:"세심하게 챙겨주는 연인과 함께라면 사랑을 자주, 크게 느낄 수 있어요.",
    empty:"이 언어가 채워지지 않으면: 말로는 사랑한다면서 행동이 안 따라오면, 그 진심이 자꾸 의심스러워져요." },
  gifts:{ name:"마음을 담은 선물에 설레는 사람", sub:"선물 (Receiving Gifts)",
    desc:"선물의 가격보다 '나를 생각하며 골랐다'는 마음 자체에 감동받는 타입이에요. 작은 메모나 소소한 선물 하나에도 사랑이 느껴진다면 이 유형일 가능성이 높아요. 오해받기 쉬운 유형이지만, 핵심은 물건이 아니라 그 안의 정성이라는 걸 기억해두면 좋아요.",
    match:"작은 것 하나도 세심하게 챙기는 연인과 궁합이 좋아요.",
    empty:"이 언어가 채워지지 않으면: 기념일이나 특별한 날을 그냥 넘기면 서운함이 유독 오래 남아요." },
  touch:{ name:"스킨십으로 사랑을 확인받는 사람", sub:"스킨십 (Physical Touch)",
    desc:"손을 잡거나 안아주는 것처럼, 신체적인 접촉을 통해 사랑을 가장 크게 느끼는 타입이에요. 말보다 스킨십이 있을 때 더 안정감을 느끼고, 반대로 스킨십이 줄어들면 관계에 문제가 있는 건 아닌지 불안해지기도 해요.",
    match:"애정 표현에 적극적인 연인과 함께일 때 특히 편안함을 느껴요.",
    empty:"이 언어가 채워지지 않으면: 다른 건 다 괜찮아도 스킨십이 줄면 마음 한켠이 계속 허전해요." }
};

let current = 0;
const scores = { words:0, time:0, acts:0, gifts:0, touch:0 };

function startQuiz(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
  renderQuestion();
}

function renderQuestion(){
  const q = questions[current];
  const quizEl = document.getElementById('quiz');

  const row = document.createElement('div');
  row.className = 'bubble-row';
  row.innerHTML = '<div class="bubble them">' + q.them + '</div>';
  quizEl.appendChild(row);

  const answers = document.createElement('div');
  answers.className = 'answers';
  answers.id = 'answers-' + current;
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(opt.val, opt.text);
    answers.appendChild(btn);
  });
  quizEl.appendChild(answers);

  quizEl.scrollTop = quizEl.scrollHeight;
  document.getElementById('progressBar').style.width = ((current)/questions.length*100) + '%';
}

function selectAnswer(val, text){
  scores[val]++;
  document.getElementById('answers-' + current).remove();

  const quizEl = document.getElementById('quiz');
  const meRow = document.createElement('div');
  meRow.className = 'bubble-row';
  meRow.innerHTML = '<div class="bubble me">' + text + '</div>';
  quizEl.appendChild(meRow);
  quizEl.scrollTop = quizEl.scrollHeight;

  current++;
  document.getElementById('progressBar').style.width = (current/questions.length*100) + '%';

  if(current < questions.length){
    document.getElementById('statusText').textContent = "질문 " + (current+1) + " / " + questions.length;
    setTimeout(renderQuestion, 350);
  } else {
    document.getElementById('statusText').textContent = "결과 도착!";
    setTimeout(showResult, 500);
  }
}

function showResult(){
  const top = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = results[top];
  document.getElementById('rName').textContent = r.name;
  document.getElementById('rSub').textContent = r.sub;
  document.getElementById('rDesc').textContent = r.desc;
  document.getElementById('rMatch').innerHTML = '💛 ' + r.match;
  document.getElementById('rEmpty').textContent = r.empty;

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
}

function restartQuiz(){
  current = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  document.getElementById('quiz').innerHTML = '';
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('statusText').textContent = '대화 중...';
}

function copyResult(){
  const name = document.getElementById('rName').textContent;
  const sub = document.getElementById('rSub').textContent;
  const text = "나의 사랑의 언어는 [" + sub + "] " + name + "! 너도 테스트 해봐 → (배포 후 실제 링크로 교체)";
  const toast = document.getElementById('copyToast');
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  }
}
</script>

</body>
</html>
